const H=x=>Object.assign({'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY},x||{});

async function count(tb){const r=await fetch(SB_URL+'/rest/v1/'+tb+'?select=id&limit=1',{headers:H({'Prefer':'count=exact','Range-Unit':'items','Range':'0-0'})});if(!r.ok&&r.status!==206&&r.status!==416)throw new Error(tb+' 조회 실패 '+r.status);const cr=r.headers.get('content-range')||'*/0';return +cr.split('/')[1]||0;}
async function post(tb,rows){const r=await fetch(SB_URL+'/rest/v1/'+tb,{method:'POST',headers:H({'Content-Type':'application/json','Prefer':'return=representation'}),body:JSON.stringify(rows)});if(!r.ok){let m=r.status;try{m=(await r.json()).message||m;}catch(_){}throw new Error(tb+' 저장 실패: '+m);}return r.json();}

async function check(){

  }catch(e){document.getElementById('log').innerHTML='';log('DB에 연결하지 못했습니다: '+e.message,'err');return false;}
}
async function run(){
  const btn=document.getElementById('go');btn.disabled=true;

    const its=await post('dev_items',DATA.items.map((it,ix)=>({project_id:it.pidx==null?null:pr[it.pidx].id,vendor:it.vendor,kind:it.kind,title:it.title,supply_type:it.supply_type,reg_text:it.reg_text,done_text:it.done_text,target_text:it.target_text,remark:it.remark,old_no:it.old_no,stages:it.stages||{},sort_no:ix+1,origin:'엑셀이관',created_name:'엑셀이관'})));
    if(its.length!==DATA.items.length) throw new Error('건 저장 건수가 다릅니다');
    const logs=[];DATA.items.forEach((it,ix)=>{it.logs.forEach((l,j)=>{logs.push({item_id:its[ix].id,log_date:l.log_date,date_text:l.date_text,stage:l.stage,content:l.content,sort_no:j+1,origin:'엑셀이관',emp_name:'엑셀이관'});});});
    let done=0;

    else log('저장은 끝났지만 건수가 예상과 다릅니다('+c.join(' / ')+'). Claude에게 알려 주세요.','err');
