    if(ex.length){log('이미 들어 있어 실행하지 않습니다. 다시 넣어야 하면 Claude에게 알려 주세요.','err');return false;}
    log('아직 넣지 않았습니다. 「가져오기 실행」을 누르세요.');document.getElementById('go').disabled=false;return true;
  }catch(e){document.getElementById('log').innerHTML='';log('DB에 연결하지 못했습니다: '+e.message,'err');return false;}
}
async function run(){
  const btn=document.getElementById('go');btn.disabled=true;
  if(!(await check())) return; btn.disabled=true;
  try{
    const mx=await get('dev_items?select=sort_no&order=sort_no.desc.nullslast&limit=1'); const base=(mx[0]&&mx[0].sort_no)||0;
    log('1/2 건 '+DATA.length+'건 저장 중…');
    const its=await post('dev_items',DATA.map((it,ix)=>({project_id:it.pid,vendor:'CHEMTROS',kind:'업체개발',title:it.title,remark:it.remark,stages:{},sort_no:base+ix+1,origin:ORG,created_name:'엑셀이관'})));
    if(its.length!==DATA.length) throw new Error('건 저장 건수가 다릅니다');
    const logs=[];DATA.forEach((it,ix)=>{it.logs.forEach((l,j)=>{logs.push({item_id:its[ix].id,log_date:l.log_date,date_text:l.date_text,content:l.content,sort_no:j+1,origin:ORG,emp_name:'엑셀이관'});});});
    const part=await post('dev_logs',logs);
    log('2/2 활동 '+part.length+' / '+logs.length);
    if(part.length===NL) log('완료되었습니다. 건 '+its.length+'건 · 활동 '+part.length+'건. 이 창은 닫으셔도 됩니다.','ok');
    else log('저장은 끝났지만 건수가 예상과 다릅니다. Claude에게 알려 주세요.','err');
  }catch(e){log('중간에 멈췄습니다: '+e.message+'\n이 화면을 그대로 두고 Claude에게 알려 주세요. 다시 누르지 마세요.','err');}
}
check();
</script></body></html>
