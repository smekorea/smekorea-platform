<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SMEKOREA KPI 프로세스 - 제조팀</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#eef2f8;--surface:#fff;--border:#d7e0ee;
    --navy:#182338;--purple:#6d28d9;
    --text:#1a2233;--muted:#7a8baa;
    --shadow:0 2px 10px rgba(20,30,60,0.08);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:'Noto Sans KR',sans-serif;min-height:100vh;}

  .topbar{background:var(--navy);padding:0 24px;height:64px;display:flex;align-items:center;justify-content:space-between;}
  .brand{display:flex;align-items:center;gap:12px;}
  .brand-badge{background:var(--purple);color:#fff;font-weight:900;font-size:12px;padding:8px 12px;border-radius:6px;letter-spacing:1px;}
  .brand-title{color:#fff;font-size:19px;font-weight:800;}
  .brand-sub{color:#8fa3c7;font-size:11px;margin-top:2px;}
  .top-right{display:flex;align-items:center;gap:10px;}
  .top-btn{background:rgba(255,255,255,0.08);color:#c9d6ec;border:1px solid rgba(255,255,255,0.15);padding:7px 13px;border-radius:7px;font-size:12px;font-weight:700;cursor:pointer;text-decoration:none;}
  .top-btn:hover{background:rgba(255,255,255,0.16);color:#fff;}
  .clock{font-family:'Noto Sans KR',sans-serif;color:#5b9bff;font-size:19px;letter-spacing:1px;}
  /* ── 화면이동 네비게이션 표준 (SMERP 공통) — [← 뒤로][⌂ 홈] 2버튼 고정 ── */
  .nav-group{display:flex;align-items:center;gap:6px;}
  .nav-btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;height:32px;padding:0 13px;border-radius:7px;font-size:12px;font-weight:700;text-decoration:none;cursor:pointer;white-space:nowrap;font-family:'Noto Sans KR',sans-serif;transition:all .18s;}
  .nav-back{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);color:#c9d6ec;}
  .nav-back:hover{background:rgba(255,255,255,0.16);color:#fff;}
  .nav-home{background:var(--purple);border:1px solid var(--purple);color:#fff;}
  .nav-home:hover{filter:brightness(1.1);}

  .prep-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:calc(100vh - 64px);padding:24px;text-align:center;}
  .prep-icon{font-size:56px;margin-bottom:18px;}
  .prep-title{font-size:22px;font-weight:800;color:var(--text);margin-bottom:8px;}
  .prep-desc{font-size:14px;color:var(--muted);max-width:420px;line-height:1.6;}
  .prep-card{background:var(--surface);border-radius:12px;box-shadow:var(--shadow);padding:40px 48px;}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <div class="brand-badge">KPI</div>
    <div><div class="brand-title">KPI 프로세스 - 제조팀</div><div class="brand-sub">부서 · 프로세스별 실적 지표</div></div>
  </div>
  <div class="top-right">
    <div class="nav-group">
      <button class="nav-btn nav-back" onclick="if(history.length>1){history.back();}else{location.href='index.html';}">← 뒤로</button>
      <a class="nav-btn nav-home" href="index.html">⌂ 홈</a>
    </div>
    <div class="clock" id="clock">--:--:--</div>
  </div>
</div>

<div class="prep-wrap">
  <div class="prep-card">
    <div class="prep-icon">⚙️</div>
    <div class="prep-title">제조팀 KPI 준비중입니다</div>
    <div class="prep-desc">제조팀 실적 지표(가동율 · 생산실적 등)는 설계 확정 후 순차적으로 오픈될 예정입니다.</div>
  </div>
</div>

<script>
function tick(){
  const el=document.getElementById('clock');
  if(el) el.textContent=new Date().toLocaleTimeString('ko-KR',{hour12:false});
}
tick();setInterval(tick,1000);
</script>
</body>
</html>
