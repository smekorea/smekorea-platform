<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SME WorkFlow</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=Share+Tech+Mono&family=Barlow+Condensed:wght@700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --bg:#f7f4ef; --surf:#ffffff; --surf2:#fbf9f5;
  --bdr:#e5ddd4; --bdr2:#cdd5df; --row:#f0ede8;
  --t1:#1a1612; --t2:#5a5048; --t3:#9a8e82; --t4:#c0b4a8;
  --red:#c8001e; --blue:#1a4fa0; --green:#1e7a45;
  --amber:#d97706; --purple:#6d28d9;
  --accent:#1a4fa0;
  --hdr:#2c2420;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;font-family:'Noto Sans KR',sans-serif;}
body{background:var(--bg);color:var(--t1);}

/* ══ 로그인 화면 ══ */
#loginScreen{
  display:flex;align-items:center;justify-content:center;
  min-height:100vh;background:var(--hdr);
}
.login-box{
  background:var(--surf);border-radius:20px;
  padding:40px;width:380px;
  box-shadow:0 24px 64px rgba(0,0,0,.3);
}
.login-logo{
  font-family:'Barlow Condensed',sans-serif;
  font-weight:900;font-size:36px;color:var(--red);
  letter-spacing:-1px;margin-bottom:4px;
}
.login-sub{
  font-family:'Share Tech Mono',monospace;
  font-size:11px;color:var(--t3);letter-spacing:2px;
  margin-bottom:28px;
}
.login-lbl{font-size:11px;font-weight:700;color:var(--t3);letter-spacing:1px;margin-bottom:6px;}
.login-sel,.login-inp{
  width:100%;height:46px;border:2px solid var(--bdr);border-radius:10px;
  font-size:14px;padding:0 14px;
  background:var(--surf2);font-family:'Noto Sans KR',sans-serif;
  color:var(--t1);outline:none;margin-bottom:14px;
}
.login-sel:focus,.login-inp:focus{border-color:var(--blue);}
.login-session{
  display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:20px;
}
.sess-btn{
  padding:8px 4px;border:1.5px solid var(--bdr);border-radius:8px;
  background:var(--surf2);font-size:12px;font-weight:500;color:var(--t3);
  cursor:pointer;text-align:center;transition:all .12s;
}
.sess-btn.on{border-color:var(--blue);background:rgba(26,79,160,.08);color:var(--blue);font-weight:700;}
.login-btn{
  width:100%;height:48px;border:none;border-radius:10px;
  background:var(--red);color:#fff;
  font-size:15px;font-weight:700;cursor:pointer;
  font-family:'Noto Sans KR',sans-serif;
  transition:background .15s;margin-bottom:8px;
}
.login-btn:hover{background:#a50018;}
.login-err{font-size:12px;color:var(--red);min-height:18px;margin-bottom:4px;text-align:center;}

/* ══ 메인 화면 ══ */
#mainScreen{display:none;flex-direction:column;min-height:100vh;}

/* 헤더 */
.wf-hdr{
  background:var(--hdr);height:56px;
  display:flex;align-items:center;padding:0 20px;gap:16px;
  position:sticky;top:0;z-index:50;flex-shrink:0;
}
.wf-hdr-logo{
  font-family:'Barlow Condensed',sans-serif;
  font-weight:900;font-size:22px;color:var(--red);letter-spacing:-0.5px;
}
.wf-hdr-sub{
  font-family:'Share Tech Mono',monospace;
  font-size:10px;color:rgba(255,255,255,.35);letter-spacing:1px;
}
.wf-hdr-user{
  margin-left:auto;display:flex;align-items:center;gap:8px;
}
.wf-hdr-name{font-size:13px;color:rgba(255,255,255,.8);}
.wf-hdr-dept{
  font-family:'Share Tech Mono',monospace;
  font-size:10px;color:rgba(255,255,255,.4);
}
.wf-logout{
  font-family:'Share Tech Mono',monospace;font-size:9px;
  color:rgba(255,255,255,.4);background:none;
  border:1px solid rgba(255,255,255,.15);border-radius:4px;
  padding:3px 8px;cursor:pointer;letter-spacing:1px;
}
.wf-logout:hover{color:var(--red);border-color:var(--red);}

/* 탭 바 */
.wf-tabs{
  background:var(--surf);border-bottom:2px solid var(--bdr);
  display:flex;padding:0 20px;gap:0;flex-shrink:0;
}
.wf-tab{
  padding:14px 20px;border:none;background:none;
  font-size:13px;font-weight:500;color:var(--t3);
  cursor:pointer;border-bottom:3px solid transparent;
  margin-bottom:-2px;transition:all .15s;
  font-family:'Noto Sans KR',sans-serif;
}
.wf-tab:hover{color:var(--t2);}
.wf-tab.on{color:var(--blue);border-bottom-color:var(--blue);font-weight:700;}

/* 콘텐츠 */
.wf-body{flex:1;overflow-y:auto;padding:24px;}
.wf-panel{display:none;}
.wf-panel.on{display:block;}

/* 섹션 타이틀 */
.sec-title{
  font-size:16px;font-weight:700;color:var(--t1);
  margin-bottom:16px;display:flex;align-items:center;gap:8px;
}
.sec-badge{
  font-family:'Share Tech Mono',monospace;font-size:11px;
  color:var(--t3);background:var(--surf2);
  border:1px solid var(--bdr);border-radius:10px;padding:2px 8px;
}

/* ── 일정 탭 ── */
.cal-wrap{display:grid;grid-template-columns:320px 1fr;gap:20px;}

/* 달력 */
.cal-box{background:var(--surf);border:1px solid var(--bdr);border-radius:12px;overflow:hidden;}
.cal-hdr{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 18px;border-bottom:1px solid var(--bdr);
}
.cal-month{font-size:15px;font-weight:700;color:var(--t1);}
.cal-nav{display:flex;gap:4px;}
.cal-nav-btn{
  width:28px;height:28px;border-radius:6px;
  border:1px solid var(--bdr);background:var(--surf2);
  color:var(--t3);font-size:13px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
}
.cal-nav-btn:hover{border-color:var(--bdr2);color:var(--t1);}
.cal-grid{padding:12px;}
.cal-dow{
  display:grid;grid-template-columns:repeat(7,1fr);
  text-align:center;margin-bottom:4px;
}
.cal-dow span{
  font-family:'Share Tech Mono',monospace;
  font-size:10px;color:var(--t4);padding:4px 0;
}
.cal-days{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;}
.cal-day{
  aspect-ratio:1;border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  font-size:13px;cursor:pointer;position:relative;
  transition:background .1s;
}
.cal-day:hover{background:var(--surf2);}
.cal-day.other{color:var(--t4);}
.cal-day.today{background:var(--blue);color:#fff;font-weight:700;}
.cal-day.selected{background:var(--blue);color:#fff;font-weight:700;}
.cal-day.has-event::after{
  content:'';position:absolute;bottom:3px;left:50%;transform:translateX(-50%);
  width:4px;height:4px;border-radius:50%;background:var(--amber);
}
.cal-day.today.has-event::after{background:#fff;}

/* 일정 목록 */
.schedule-box{background:var(--surf);border:1px solid var(--bdr);border-radius:12px;overflow:hidden;}
.schedule-hdr{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 18px;border-bottom:1px solid var(--bdr);
}
.schedule-title{font-size:14px;font-weight:700;color:var(--t1);}
.btn-add{
  height:34px;padding:0 14px;border-radius:7px;
  background:var(--blue);color:#fff;border:none;
  font-size:12px;font-weight:600;cursor:pointer;
  font-family:'Noto Sans KR',sans-serif;
}
.btn-add:hover{background:#1a3f80;}
.schedule-list{padding:12px;display:flex;flex-direction:column;gap:8px;max-height:480px;overflow-y:auto;}
.sch-item{
  border:1px solid var(--bdr);border-radius:9px;padding:12px 14px;
  display:flex;gap:12px;align-items:flex-start;cursor:pointer;
  transition:box-shadow .12s;
}
.sch-item:hover{box-shadow:0 2px 10px rgba(0,0,0,.08);}
.sch-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;margin-top:4px;}
.sch-info{flex:1;}
.sch-date{font-family:'Share Tech Mono',monospace;font-size:10px;color:var(--t4);}
.sch-title{font-size:13px;font-weight:600;color:var(--t1);margin-top:2px;}
.sch-desc{font-size:11.5px;color:var(--t3);margin-top:2px;}
.sch-empty{text-align:center;padding:40px;color:var(--t4);font-size:13px;}

/* ── 업무일지 탭 ── */
.diary-filter{
  display:flex;gap:8px;flex-wrap:wrap;align-items:center;
  margin-bottom:14px;
}
.diary-filter input,.diary-filter select{
  height:36px;border:1.5px solid var(--bdr);border-radius:8px;
  padding:0 10px;font-size:13px;color:var(--t1);
  background:var(--surf);outline:none;font-family:'Noto Sans KR',sans-serif;
}
.diary-filter input{width:180px;}
.diary-filter input:focus,.diary-filter select:focus{border-color:var(--blue);}
.btn-search{
  height:36px;padding:0 16px;border-radius:8px;
  background:var(--blue);color:#fff;border:none;
  font-size:13px;font-weight:600;cursor:pointer;
  font-family:'Noto Sans KR',sans-serif;
}
.btn-csv{
  height:36px;padding:0 14px;border-radius:8px;
  background:var(--surf);color:var(--t2);
  border:1.5px solid var(--bdr);font-size:12px;cursor:pointer;
  font-family:'Noto Sans KR',sans-serif;margin-left:auto;
}
.btn-csv:hover{border-color:var(--green);color:var(--green);}
.btn-new-diary{
  height:36px;padding:0 16px;border-radius:8px;
  background:var(--green);color:#fff;border:none;
  font-size:13px;font-weight:600;cursor:pointer;
  font-family:'Noto Sans KR',sans-serif;
}

/* 업무일지 테이블 */
.tbl-wrap{overflow-x:auto;background:var(--surf);border:1px solid var(--bdr);border-radius:12px;}
.diary-tbl{width:100%;border-collapse:collapse;}
.diary-tbl thead th{
  background:#f0ede8;font-size:12px;font-weight:700;
  color:var(--t2);padding:11px 14px;text-align:left;
  border-bottom:2px solid var(--bdr);
  border-right:1px solid var(--bdr);
}
.diary-tbl thead th:last-child{border-right:none;}
.diary-tbl tbody tr{border-bottom:1.5px solid var(--row);cursor:pointer;transition:background .1s;}
.diary-tbl tbody tr:hover{background:#f5f1eb;}
.diary-tbl td{
  padding:11px 14px;font-size:13px;color:var(--t1);
  border-right:1px solid var(--row);vertical-align:middle;
}
.diary-tbl td:last-child{border-right:none;}
.badge-cat{
  display:inline-block;font-size:10px;padding:2px 8px;
  border-radius:4px;font-weight:500;white-space:nowrap;
}
.badge-shared{background:rgba(26,79,160,.1);color:var(--blue);}
.badge-status-done{background:rgba(30,122,69,.1);color:var(--green);}
.badge-status-ing{background:rgba(217,119,6,.1);color:var(--amber);}
.badge-status-hold{background:rgba(156,163,175,.1);color:#6b7280;}
.badge-status-follow{background:rgba(200,0,30,.1);color:var(--red);}

/* 페이지네이션 */
.pagination{
  display:flex;align-items:center;justify-content:center;
  gap:4px;margin-top:16px;flex-wrap:wrap;
}
.page-btn{
  min-width:32px;height:32px;padding:0 8px;border-radius:6px;
  border:1.5px solid var(--bdr);background:var(--surf);
  font-size:12px;color:var(--t2);cursor:pointer;
  font-family:'Share Tech Mono',monospace;transition:all .1s;
}
.page-btn:hover{border-color:var(--blue);color:var(--blue);}
.page-btn.on{background:var(--blue);color:#fff;border-color:var(--blue);font-weight:700;}
.page-btn.nav{color:var(--t3);}
.page-info{
  font-family:'Share Tech Mono',monospace;font-size:11px;
  color:var(--t4);margin:0 8px;
}

/* ── 공유함 탭 ── */
.share-item{
  background:var(--surf);border:1px solid var(--bdr);border-radius:10px;
  padding:16px;margin-bottom:10px;
}
.share-item-hdr{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.share-from{font-size:12px;font-weight:700;color:var(--blue);}
.share-date{font-family:'Share Tech Mono',monospace;font-size:11px;color:var(--t4);}
.share-type{
  font-size:10px;padding:2px 8px;border-radius:4px;
  font-weight:600;margin-left:auto;
}
.share-type.전달사항{background:rgba(26,79,160,.1);color:var(--blue);}
.share-type.지시사항{background:rgba(200,0,30,.1);color:var(--red);}
.share-title{font-size:14px;font-weight:700;color:var(--t1);margin-bottom:4px;}
.share-content{font-size:13px;color:var(--t2);line-height:1.6;}

/* ── 설정 탭 ── */
.setting-box{
  background:var(--surf);border:1px solid var(--bdr);border-radius:12px;
  padding:24px;max-width:460px;margin-bottom:16px;
}
.setting-title{font-size:15px;font-weight:700;color:var(--t1);margin-bottom:18px;}
.setting-row{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;}
.setting-lbl{font-size:12px;font-weight:700;color:var(--t3);letter-spacing:.5px;}
.setting-inp{
  height:42px;border:1.5px solid var(--bdr);border-radius:8px;
  font-size:14px;padding:0 12px;background:var(--surf2);
  font-family:'Noto Sans KR',sans-serif;color:var(--t1);outline:none;
}
.setting-inp:focus{border-color:var(--blue);}
.setting-btn{
  height:42px;padding:0 20px;border-radius:8px;
  background:var(--blue);color:#fff;border:none;
  font-size:13px;font-weight:700;cursor:pointer;
  font-family:'Noto Sans KR',sans-serif;
}
.setting-btn:hover{background:#1a3f80;}
.setting-session{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:6px;}
.sess-opt{
  padding:10px;border:1.5px solid var(--bdr);border-radius:8px;
  text-align:center;font-size:13px;cursor:pointer;
  color:var(--t3);transition:all .12s;
}
.sess-opt.on{border-color:var(--blue);background:rgba(26,79,160,.07);color:var(--blue);font-weight:700;}

/* ── 모달 ── */
.modal-overlay{
  display:none;position:fixed;inset:0;z-index:200;
  background:rgba(0,0,0,.45);align-items:center;justify-content:center;
}
.modal-overlay.show{display:flex;}
.modal-box{
  background:var(--surf);border-radius:16px;
  padding:28px;width:520px;max-height:90vh;overflow-y:auto;
  box-shadow:0 24px 64px rgba(0,0,0,.25);
}
.modal-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;}
.modal-title{font-size:16px;font-weight:700;color:var(--t1);}
.modal-close{background:none;border:none;font-size:18px;color:var(--t3);cursor:pointer;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;}
.form-row.full{grid-template-columns:1fr;}
.form-group{display:flex;flex-direction:column;gap:5px;}
.form-group label{font-size:11px;font-weight:700;color:var(--t3);letter-spacing:.5px;}
.form-group input,.form-group select,.form-group textarea{
  border:1.5px solid var(--bdr);border-radius:8px;
  font-size:13px;padding:8px 12px;background:var(--surf2);
  font-family:'Noto Sans KR',sans-serif;color:var(--t1);outline:none;
}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--blue);}
.form-group textarea{resize:vertical;min-height:80px;}
.modal-footer{display:flex;gap:8px;justify-content:flex-end;margin-top:20px;}
.btn-cancel{
  height:40px;padding:0 18px;border-radius:8px;
  border:1.5px solid var(--bdr);background:var(--surf);
  color:var(--t2);font-size:13px;cursor:pointer;
  font-family:'Noto Sans KR',sans-serif;
}
.btn-save{
  height:40px;padding:0 20px;border-radius:8px;
  border:none;background:var(--blue);color:#fff;
  font-size:13px;font-weight:700;cursor:pointer;
  font-family:'Noto Sans KR',sans-serif;
}
.btn-save:hover{background:#1a3f80;}

/* 공유 토글 */
.share-toggle{
  display:flex;align-items:center;gap:10px;
  padding:10px 12px;background:rgba(26,79,160,.05);
  border:1px solid rgba(26,79,160,.15);border-radius:8px;margin-top:4px;
}
.share-toggle input[type=checkbox]{width:16px;height:16px;cursor:pointer;}
.share-toggle-lbl{font-size:13px;color:var(--t2);}

/* 로딩/빈상태 */
.loading-state{text-align:center;padding:40px;color:var(--t4);font-size:13px;}
.spinner{
  width:24px;height:24px;border:3px solid var(--bdr);
  border-top-color:var(--blue);border-radius:50%;
  animation:spin .7s linear infinite;margin:0 auto 10px;
}
@keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>

<!-- ══ 로그인 화면 ══ -->
<div id="loginScreen">
  <div class="login-box">
    <div class="login-logo">SME WorkFlow</div>
    <div class="login-sub">PERSONAL WORKFLOW SYSTEM</div>

    <div class="login-lbl">이름</div>
    <select class="login-sel" id="loginName">
      <option value="">— 선택해주세요 —</option>
    </select>

    <div class="login-lbl">비밀번호</div>
    <input class="login-inp" id="loginPw" type="password" maxlength="4" placeholder="••••"
      onkeydown="if(event.key==='Enter')doLogin()">

    <div class="login-lbl">로그인 유지</div>
    <div class="login-session">
      <div class="sess-btn" data-h="1" onclick="selSess(this)">1시간</div>
      <div class="sess-btn" data-h="3" onclick="selSess(this)">3시간</div>
      <div class="sess-btn on" data-h="8" onclick="selSess(this)">8시간</div>
      <div class="sess-btn" data-h="24" onclick="selSess(this)">24시간</div>
    </div>

    <div class="login-err" id="loginErr"></div>
    <button class="login-btn" onclick="doLogin()">로그인</button>
  </div>
</div>

<!-- ══ 메인 화면 ══ -->
<div id="mainScreen" style="display:none;flex-direction:column;min-height:100vh;">

  <!-- 헤더 -->
  <header class="wf-hdr">
    <div>
      <div class="wf-hdr-logo">WorkFlow</div>
    </div>
    <div class="wf-hdr-sub">SME KOREA</div>
    <div class="wf-hdr-user">
      <div>
        <div class="wf-hdr-name" id="hdrName"></div>
        <div class="wf-hdr-dept" id="hdrDept"></div>
      </div>
      <button class="wf-logout" onclick="doLogout()">LOGOUT</button>
    </div>
  </header>

  <!-- 탭 -->
  <div class="wf-tabs">
    <button class="wf-tab on" onclick="switchTab('schedule')">📅 일정</button>
    <button class="wf-tab" onclick="switchTab('diary')">📋 업무일지</button>
    <button class="wf-tab" onclick="switchTab('share')">📢 공유함</button>
    <button class="wf-tab" onclick="switchTab('settings')">⚙ 설정</button>
  </div>

  <!-- 본문 -->
  <div class="wf-body">

    <!-- 📅 일정 탭 -->
    <div class="wf-panel on" id="panel-schedule">
      <div class="cal-wrap">
        <!-- 달력 -->
        <div>
          <div class="cal-box">
            <div class="cal-hdr">
              <div class="cal-month" id="calMonthTitle"></div>
              <div class="cal-nav">
                <button class="cal-nav-btn" onclick="moveMonth(-1)">‹</button>
                <button class="cal-nav-btn" onclick="moveMonth(1)">›</button>
              </div>
            </div>
            <div class="cal-grid">
              <div class="cal-dow">
                <span style="color:#c8001e;">일</span><span>월</span><span>화</span>
                <span>수</span><span>목</span><span>금</span><span style="color:#1a4fa0;">토</span>
              </div>
              <div class="cal-days" id="calDays"></div>
            </div>
          </div>
        </div>

        <!-- 일정 목록 -->
        <div class="schedule-box">
          <div class="schedule-hdr">
            <div class="schedule-title" id="schListTitle">일정 목록</div>
            <button class="btn-add" onclick="openSchModal()">+ 일정 등록</button>
          </div>
          <div class="schedule-list" id="schList">
            <div class="loading-state"><div class="spinner"></div>로딩 중...</div>
          </div>
        </div>
      </div>
    </div>

    <!-- 📋 업무일지 탭 -->
    <div class="wf-panel" id="panel-diary">
      <div class="diary-filter">
        <input type="text" id="dkw1" placeholder="검색어 1" onkeydown="if(event.key==='Enter')searchDiary()">
        <input type="text" id="dkw2" placeholder="검색어 2" onkeydown="if(event.key==='Enter')searchDiary()">

<script>
const SB_URL = 'https://muxuhrbsbrstmrrvlupw.supabase.co';
const SB_KEY = 'sb_publishable_RYvQTDoDvwTuVPezpIeotg_EDSd9Wbb';
const sb = supabase.createClient(SB_URL, SB_KEY);

// ── 세션 관리 ──
let _sess = { empId:null, empNo:null, name:'', dept:'', rank:'', sessH:8, expire:0 };
let _sessH = 8;

function selSess(btn) {
  document.querySelectorAll('.sess-btn').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
  _sessH = +btn.dataset.h;
}

function saveSession(emp) {
  const expire = Date.now() + _sessH * 3600000;
  const data = { empId: emp.id, empNo: emp.emp_no, name: emp.name, dept: emp.dept, rank: emp.rank, sessH: _sessH, expire };
  localStorage.setItem('wf_session', JSON.stringify(data));
  _sess = data;
}

function loadSession() {
  try {
    const d = JSON.parse(localStorage.getItem('wf_session') || '{}');
    if (d.expire && d.expire > Date.now()) { _sess = d; return true; }
  } catch(e) {}
  return false;
}

function clearSession() {
  localStorage.removeItem('wf_session');
  _sess = { empId:null, empNo:null, name:'', dept:'', rank:'', sessH:8, expire:0 };
}

// ── 직원 목록 로드 ──
async function loadEmployees() {
  const { data } = await sb.from('employees').select('id,emp_no,name,dept,rank,active').eq('active', true).order('emp_no');
  const sel = document.getElementById('loginName');
  (data || []).forEach(e => {
    const opt = document.createElement('option');
    opt.value = e.id;
    opt.dataset.name = e.name;
    opt.dataset.dept = e.dept || '';
    opt.dataset.rank = e.rank || '';
    opt.textContent = `${e.name} ${e.rank ? '(' + e.rank + ')' : ''}`;
    sel.appendChild(opt);
  });
}

// ── 로그인 ──
async function doLogin() {
  const sel = document.getElementById('loginName');
  const empId = sel.value;
  const pw = document.getElementById('loginPw').value;
  const err = document.getElementById('loginErr');
  err.textContent = '';

  if (!empId) { err.textContent = '⚠ 이름을 선택해주세요'; return; }
  if (!pw) { err.textContent = '⚠ 비밀번호를 입력해주세요'; return; }

  const { data, error } = await sb.from('employees').select('id,emp_no,name,dept,rank,wf_password').eq('id', empId).single();
  if (error || !data) { err.textContent = '⚠ 직원 정보를 찾을 수 없습니다'; return; }

  const correctPw = data.wf_password || '1111';
  if (pw !== correctPw) { err.textContent = '⚠ 비밀번호가 올바르지 않습니다'; document.getElementById('loginPw').value = ''; return; }

  saveSession(data);
  showMain();
}

function doLogout() {
  if (!confirm('로그아웃 하시겠습니까?')) return;
  clearSession();
  location.reload();
}

// ── 메인 화면 표시 ──
function showMain() {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('mainScreen').style.display = 'flex';
  document.getElementById('hdrName').textContent = _sess.name + ' ' + (_sess.rank || '') + '님';
  document.getElementById('hdrDept').textContent = _sess.dept || '';
  initSessOpts();
  loadSchedule();
  loadDiary();
}

// ── 탭 전환 ──
function switchTab(t) {
  document.querySelectorAll('.wf-tab').forEach((btn, i) => {
    const tabs = ['schedule','diary','share','settings'];
    btn.classList.toggle('on', tabs[i] === t);
  });
  document.querySelectorAll('.wf-panel').forEach(p => p.classList.remove('on'));
  document.getElementById('panel-' + t).classList.add('on');
  if (t === 'share') loadShare();
  if (t === 'settings') initSessOpts();
}

// ══════════════════════════════
// ── 📅 일정 탭 ──
// ══════════════════════════════
let _calYear, _calMonth, _schData = [], _schEditId = null, _selDate = null;

async function loadSchedule() {
  const now = new Date();
  _calYear = now.getFullYear();
  _calMonth = now.getMonth();
  const { data } = await sb.from('sme_calendar').select('*').eq('employee_id', _sess.empId).order('event_date');
  _schData = data || [];
  renderCal();
  renderSchList();
}

function renderCal() {
  const title = document.getElementById('calMonthTitle');
  title.textContent = `${_calYear}년 ${_calMonth + 1}월`;
  const days = document.getElementById('calDays');
  days.innerHTML = '';
  const first = new Date(_calYear, _calMonth, 1).getDay();
  const last = new Date(_calYear, _calMonth + 1, 0).getDate();
  const today = new Date();
  const eventDates = new Set(_schData.map(e => e.event_date?.substring(0,10)).filter(Boolean));

  for (let i = 0; i < first; i++) {
    const prev = new Date(_calYear, _calMonth, -first + i + 1).getDate();
    days.innerHTML += `<div class="cal-day other">${prev}</div>`;
  }
  for (let d = 1; d <= last; d++) {
    const ds = `${_calYear}-${String(_calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isToday = today.getFullYear()===_calYear && today.getMonth()===_calMonth && today.getDate()===d;
    const isSel = _selDate === ds;
    const hasEv = eventDates.has(ds);
    let cls = 'cal-day';
    if (isToday) cls += ' today';
    if (isSel && !isToday) cls += ' selected';
    if (hasEv) cls += ' has-event';
    days.innerHTML += `<div class="${cls}" onclick="selectDate('${ds}')">${d}</div>`;
  }
}

function selectDate(ds) {
  _selDate = ds;
  renderCal();
  renderSchList(ds);
}

function renderSchList(filterDate) {
  const list = document.getElementById('schList');
  const title = document.getElementById('schListTitle');
  let items = _schData;
  if (filterDate) {
    items = _schData.filter(e => e.event_date?.startsWith(filterDate));
    title.textContent = filterDate + ' 일정';
  } else {
    const today = new Date().toISOString().substring(0,10);
    items = _schData.filter(e => e.event_date >= today);
    title.textContent = '다가오는 일정';
  }
  if (!items.length) { list.innerHTML = '<div class="sch-empty">등록된 일정이 없습니다.</div>'; return; }
  list.innerHTML = items.map(e => `
    <div class="sch-item" onclick="openSchModal(${e.id})">
      <div class="sch-dot" style="background:${e.color||'#1a4fa0'}"></div>
      <div class="sch-info">
        <div class="sch-date">${e.event_date||''} ${e.event_time||''}</div>
        <div class="sch-title">${e.title||''}</div>
        ${e.content ? `<div class="sch-desc">${e.content}</div>` : ''}
      </div>
    </div>`).join('');
}

function moveMonth(d) {
  _calMonth += d;
  if (_calMonth < 0) { _calMonth = 11; _calYear--; }
  if (_calMonth > 11) { _calMonth = 0; _calYear++; }
  _selDate = null;
  renderCal();
  renderSchList();
}

function openSchModal(id) {
  _schEditId = id || null;
  const e = id ? _schData.find(x => x.id === id) : null;
  document.getElementById('schModalTitle').textContent = e ? '📅 일정 수정' : '📅 일정 등록';
  const today = new Date().toISOString().substring(0,10);
  document.getElementById('sch-date').value = e?.event_date || _selDate || today;
  document.getElementById('sch-time').value = e?.event_time || '';
  document.getElementById('sch-title').value = e?.title || '';
  document.getElementById('sch-content').value = e?.content || '';
  document.getElementById('sch-color').value = e?.color || '#1a4fa0';
  document.getElementById('schModal').classList.add('show');
}

function closeSchModal() { document.getElementById('schModal').classList.remove('show'); }

async function saveSch() {
  const title = document.getElementById('sch-title').value.trim();
  const date = document.getElementById('sch-date').value;
  if (!title || !date) { alert('날짜와 제목은 필수입니다.'); return; }
  const payload = {
    employee_id: _sess.empId,
    event_date: date,
    event_time: document.getElementById('sch-time').value || null,
    title,
    content: document.getElementById('sch-content').value.trim() || null,
    color: document.getElementById('sch-color').value,
  };
  let error;
  if (_schEditId) {
    ({ error } = await sb.from('sme_calendar').update(payload).eq('id', _schEditId));
  } else {
    ({ error } = await sb.from('sme_calendar').insert(payload));
  }
  if (error) { alert('저장 실패: ' + error.message); return; }
  closeSchModal();
  await loadSchedule();
}

// ══════════════════════════════
// ── 📋 업무일지 탭 ──
// ══════════════════════════════
let _allDiary = [], _filteredDiary = [], _diaryPage = 1;
const PAGE_SIZE = 20;
const PAGE_GROUP = 10;
let _diaryEditId = null;

async function loadDiary() {
  const tbody = document.getElementById('diaryTbody');
  tbody.innerHTML = '<tr><td colspan="7"><div class="loading-state"><div class="spinner"></div>로딩 중...</div></td></tr>';
  let rows = [], pg = 0;
  while (true) {
    const { data, error } = await sb.from('work_diary')
      .select('*').eq('employee_id', _sess.empId)
      .order('date', { ascending: false })
      .range(pg * 1000, (pg + 1) * 1000 - 1);
    if (error) break;
    if (!data || !data.length) break;
    rows = [...rows, ...data]; pg++;
    if (data.length < 1000) break;
  }
  _allDiary = rows;
  _filteredDiary = rows;
  _diaryPage = 1;
  renderDiary();
}

function searchDiary() {
  const kws = [
    document.getElementById('dkw1').value.trim().toLowerCase(),
    document.getElementById('dkw2').value.trim().toLowerCase(),
    document.getElementById('dkw3').value.trim().toLowerCase(),
  ].filter(Boolean);
  const cat = document.getElementById('dcat').value;
  const status = document.getElementById('dstatus').value;
  const ctype = document.getElementById('dctype').value;

  _filteredDiary = _allDiary.filter(r => {
    if (cat && r.category !== cat) return false;
    if (status && r.status !== status) return false;
    if (ctype && r.content_type !== ctype) return false;
    if (kws.length) {
      const text = [r.title, r.content, r.partner, r.dept_contact, r.follow_up].join(' ').toLowerCase();
      if (!kws.every(k => text.includes(k))) return false;
    }
    return true;
  });
  _diaryPage = 1;
  renderDiary();
}

function renderDiary() {
  const total = _filteredDiary.length;
  const totalPages = Math.ceil(total / PAGE_SIZE);
  document.getElementById('diaryCount').textContent = `총 ${total.toLocaleString()}건 / ${totalPages}페이지`;

  const start = (_diaryPage - 1) * PAGE_SIZE;
  const rows = _filteredDiary.slice(start, start + PAGE_SIZE);
  const tbody = document.getElementById('diaryTbody');

  if (!rows.length) {
    tbody.innerHTML = '<tr><td colspan="7"><div class="loading-state">데이터가 없습니다.</div></td></tr>';
    document.getElementById('diaryPager').innerHTML = '';
    return;
  }

  const statusBadge = s => {
    const map = { '완료':'done','진행중':'ing','보류':'hold','후속필요':'follow','지시':'follow' };
    return `<span class="badge-cat badge-status-${map[s]||'hold'}">${s||''}</span>`;
  };

  tbody.innerHTML = rows.map(r => `
    <tr onclick="openDiaryModal(${r.id})">
      <td style="font-family:monospace;font-size:12px;">${r.date||''}</td>
      <td><span class="badge-cat" style="background:#f0ede8;color:var(--t2);">${r.category||''}</span></td>
      <td><span class="badge-cat ${r.content_type==='전달사항'||r.content_type==='지시사항'?'badge-shared':''}">${r.content_type||''}</span></td>
      <td style="max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="${(r.title||'').replace(/"/g,'&quot;')}">${r.title||''}</td>
      <td>${statusBadge(r.status)}</td>
      <td style="text-align:center;">${r.is_shared ? '📢' : ''}</td>
      <td style="text-align:center;">
        <button onclick="event.stopPropagation();deleteDiary(${r.id})"
          style="font-size:11px;padding:2px 6px;border:1px solid var(--bdr);border-radius:4px;background:none;color:var(--t3);cursor:pointer;">삭제</button>
      </td>
    </tr>`).join('');

  renderPager(totalPages);
}

function renderPager(totalPages) {
  const pager = document.getElementById('diaryPager');
  if (totalPages <= 1) { pager.innerHTML = ''; return; }

  const group = Math.floor((_diaryPage - 1) / PAGE_GROUP);
  const start = group * PAGE_GROUP + 1;
  const end = Math.min(start + PAGE_GROUP - 1, totalPages);

  let html = '';
  if (group > 0) html += `<button class="page-btn nav" onclick="goPage(${start - 1})">«</button>`;
  if (_diaryPage > 1) html += `<button class="page-btn nav" onclick="goPage(${_diaryPage - 1})">‹</button>`;
  for (let i = start; i <= end; i++) {
    html += `<button class="page-btn ${i === _diaryPage ? 'on' : ''}" onclick="goPage(${i})">${i}</button>`;
  }
  if (_diaryPage < totalPages) html += `<button class="page-btn nav" onclick="goPage(${_diaryPage + 1})">›</button>`;
  if (end < totalPages) html += `<button class="page-btn nav" onclick="goPage(${end + 1})">»</button>`;
  html += `<span class="page-info">${_diaryPage} / ${totalPages}</span>`;
  pager.innerHTML = html;
}

function goPage(p) { _diaryPage = p; renderDiary(); window.scrollTo(0,0); }

function toggleDept() {
  const ct = document.getElementById('di-ctype').value;
  const row = document.getElementById('di-dept-row');
  row.style.display = (ct === '전달사항' || ct === '지시사항') ? 'grid' : 'none';
}

function openDiaryModal(id) {
  _diaryEditId = id || null;
  const r = id ? _allDiary.find(x => x.id === id) : null;
  document.getElementById('diaryModalTitle').textContent = r ? '📋 업무일지 수정' : '📋 업무일지 작성';
  document.getElementById('diarySaveBtn').textContent = r ? '수정' : '저장';
  const today = new Date().toISOString().substring(0,10);
  document.getElementById('di-date').value = r?.date || today;
  document.getElementById('di-cat').value = r?.category || '영업/거래처';
  document.getElementById('di-action').value = r?.action_type || '방문';
  document.getElementById('di-ctype').value = r?.content_type || '일반기록';
  document.getElementById('di-dept').value = r?.target_dept || '전체부서';
  document.getElementById('di-partner').value = r?.partner || '';
  document.getElementById('di-title').value = r?.title || '';
  document.getElementById('di-content').value = r?.content || '';
  document.getElementById('di-status').value = r?.status || '완료';
  document.getElementById('di-importance').value = r?.importance || '중';
  document.getElementById('di-followup').value = r?.follow_up || '';
  document.getElementById('di-shared').checked = r?.is_shared || false;
  toggleDept();
  document.getElementById('diaryModal').classList.add('show');
}

function closeDiaryModal() { document.getElementById('diaryModal').classList.remove('show'); }

async function saveDiary() {
  const title = document.getElementById('di-title').value.trim();
  const date = document.getElementById('di-date').value;
  if (!title || !date) { alert('날짜와 제목은 필수입니다.'); return; }
  const ctype = document.getElementById('di-ctype').value;
  const isShared = document.getElementById('di-shared').checked;
  const payload = {
    employee_id: _sess.empId,
    date,
    category: document.getElementById('di-cat').value,
    action_type: document.getElementById('di-action').value,
    content_type: ctype,
    target_dept: (ctype==='전달사항'||ctype==='지시사항') ? document.getElementById('di-dept').value : null,
    partner: document.getElementById('di-partner').value.trim() || null,
    title,
    content: document.getElementById('di-content').value.trim() || null,
    status: document.getElementById('di-status').value,
    importance: document.getElementById('di-importance').value,
    follow_up: document.getElementById('di-followup').value.trim() || null,
    is_shared: isShared,
    share_target: isShared ? '전체' : null,
  };
  const btn = document.getElementById('diarySaveBtn');
  btn.disabled = true; btn.textContent = '저장 중...';
  let error;
  if (_diaryEditId) {
    ({ error } = await sb.from('work_diary').update(payload).eq('id', _diaryEditId));
  } else {
    ({ error } = await sb.from('work_diary').insert(payload));
  }
  btn.disabled = false; btn.textContent = _diaryEditId ? '수정' : '저장';
  if (error) { alert('저장 실패: ' + error.message); return; }
  closeDiaryModal();
  await loadDiary();
}

async function deleteDiary(id) {
  if (!confirm('이 업무일지를 삭제하시겠습니까?')) return;
  const { error } = await sb.from('work_diary').delete().eq('id', id);
  if (error) { alert('삭제 실패: ' + error.message); return; }
  await loadDiary();
}

function downloadCSV() {
  const rows = _filteredDiary;
  if (!rows.length) { alert('데이터가 없습니다.'); return; }
  const headers = ['날짜','업무유형','활동유형','내용구분','거래처','제목','내용','상태','중요도','후속조치','공유'];
  const csv = [headers.join(','), ...rows.map(r => [
    r.date, r.category, r.action_type, r.content_type,
    r.partner, r.title, r.content, r.status, r.importance, r.follow_up,
    r.is_shared ? '공유' : ''
  ].map(v => `"${(v||'').replace(/"/g,'""')}"`).join(','))].join('\n');
  const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `업무일지_${_sess.name}_${new Date().toISOString().substring(0,10)}.csv`;
  a.click();
}

// ══════════════════════════════
// ── 📢 공유함 탭 ──
// ══════════════════════════════
async function loadShare() {
  const list = document.getElementById('shareList');
  list.innerHTML = '<div class="loading-state"><div class="spinner"></div>로딩 중...</div>';
  const filter = document.getElementById('shareFilter').value;
  let q = sb.from('work_diary')
    .select('*, employees(name, dept, rank)')
    .eq('is_shared', true)
    .order('date', { ascending: false })
    .limit(200);
  if (filter) q = q.eq('content_type', filter);
  const { data, error } = await q;
  if (error) { list.innerHTML = '<div class="loading-state">오류가 발생했습니다.</div>'; return; }
  const items = (data || []).filter(r => r.employee_id !== _sess.empId);
  document.getElementById('shareCount').textContent = `${items.length}건`;
  if (!items.length) { list.innerHTML = '<div class="loading-state">공유된 내용이 없습니다.</div>'; return; }
  list.innerHTML = items.map(r => `
    <div class="share-item">
      <div class="share-item-hdr">
        <span class="share-from">${r.employees?.name || ''} ${r.employees?.rank || ''}</span>
        <span class="share-date">${r.date || ''}</span>
        <span class="share-type ${r.content_type}">${r.content_type || ''}</span>
      </div>
      <div class="share-title">${r.title || ''}</div>
      ${r.content ? `<div class="share-content">${r.content}</div>` : ''}
    </div>`).join('');
}

// ══════════════════════════════
// ── ⚙ 설정 탭 ──
// ══════════════════════════════
function initSessOpts() {
  const h = _sess.sessH || 8;
  document.querySelectorAll('.sess-opt').forEach(el => {
    el.classList.toggle('on', +el.dataset.h === h);
  });
  const exp = new Date(_sess.expire);
  document.getElementById('sessInfo').textContent = `현재 설정: ${h}시간 / 만료: ${exp.toLocaleString('ko-KR')}`;
}

function changeSess(el) {
  document.querySelectorAll('.sess-opt').forEach(e => e.classList.remove('on'));
  el.classList.add('on');
  _sess.sessH = +el.dataset.h;
  _sess.expire = Date.now() + _sess.sessH * 3600000;
  localStorage.setItem('wf_session', JSON.stringify(_sess));
  initSessOpts();
  alert(`로그인 유지 시간이 ${_sess.sessH}시간으로 변경되었습니다.`);
}

async function changePw() {
  const old = document.getElementById('pwOld').value;
  const n1 = document.getElementById('pwNew').value;
  const n2 = document.getElementById('pwNew2').value;
  if (!old || !n1 || !n2) { alert('모든 항목을 입력해주세요.'); return; }
  if (n1 !== n2) { alert('새 비밀번호가 일치하지 않습니다.'); return; }
  if (!/^\d{4}$/.test(n1)) { alert('비밀번호는 4자리 숫자입니다.'); return; }
  const { data } = await sb.from('employees').select('wf_password').eq('id', _sess.empId).single();
  const correct = data?.wf_password || '1111';
  if (old !== correct) { alert('현재 비밀번호가 올바르지 않습니다.'); return; }
  const { error } = await sb.from('employees').update({ wf_password: n1 }).eq('id', _sess.empId);
  if (error) { alert('변경 실패: ' + error.message); return; }
  document.getElementById('pwOld').value = '';
  document.getElementById('pwNew').value = '';
  document.getElementById('pwNew2').value = '';
  alert('✅ 비밀번호가 변경되었습니다.');
}

// ── 초기화 ──
async function init() {
  await loadEmployees();
  if (loadSession()) {
    showMain();
  }
}
init();
</script>
