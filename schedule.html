<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SME CALENDAR</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
  /* ══════════════════════════════════════════════════════════════
     v15.76 (2026-10-10) — 업무보고 「행사·일정」 연동 제거 (본사 내부 건이 섞여 나옴)
     v15.75 (2026-10-10) — 전법인 통합 일정표 역할 재정의
     ── 범위: 법인 휴무 · 당직 · 전 법인 공통 일정(창립기념일 등)만.
        개인 연차·반차, 출장·미팅은 워크플로우에서 관리한다.
     ── 구분 3종(휴무/당직/공통). 구 일정·마감·기타는 폐지.
     ── 하단 「법인별 월간 현황」「연간 현황」 삭제.
     ── 색: 법인 4색 + 당직 + 공통. 아래 --c-* 와 JS COLOR 는 같은 값.
     ══════════════════════════════════════════════════════════════ */
  :root{
    --point:#1B3A6B; --point-dk:#142C52; --point-bg:#EDF1F7;
    --brand:#C8001E; --muted:#565C64; --locked:#98A0AB;
    --border:#C7CCD4; --border2:#98A0AB; --line-lt:#DFE3E8;
    --bg:#EEF0F3; --surface:#fff; --text:#1E2225; --accent3:#2E6B4F;
    --sun:#B3261E; --sat:#35618F;
    --c-hq:#B3261E; --c-china:#2E6B4F; --c-thai:#1B3A6B; --c-india:#C06414;
    --c-duty:#5B4B8A; --c-common:#8A6116;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:'Noto Sans KR',sans-serif;min-height:100vh;}

  /* ── TOPBAR — 표준: 흰 배경 + 아래 남색 2px선 ── */
  .topbar{position:sticky;top:0;z-index:200;background:#fff;border-bottom:2px solid var(--point);
    padding:0 24px;height:52px;display:flex;align-items:center;justify-content:space-between;gap:16px;}
  .topbar-left{display:flex;align-items:center;gap:12px;flex-shrink:0;}
  .brand{display:flex;align-items:center;gap:10px;}
  .brand-tag{display:inline-flex;align-items:center;justify-content:center;
    height:30px;min-width:46px;padding:0 9px;
    background:var(--brand);color:#fff;font-size:14px;font-weight:700;border-radius:2px;line-height:1;letter-spacing:.5px;}
  .brand-id{display:flex;flex-direction:column;line-height:1.25;}
  .brand-co{font-size:13px;font-weight:700;color:var(--text);letter-spacing:.3px;}
  .brand-file{font-size:10.5px;color:var(--muted);letter-spacing:.3px;}
  .brand-name{font-size:14px;font-weight:500;color:var(--text);padding-left:10px;border-left:1px solid var(--border);}

  /* ── 화면이동 네비게이션 표준 — [⧉ 새창열기][← 뒤로][⌂ 홈] ── */
  .nav-group{display:flex;align-items:center;gap:6px;}
  .nav-btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;height:30px;padding:0 12px;border-radius:2px;font-size:12px;font-weight:700;text-decoration:none;cursor:pointer;white-space:nowrap;font-family:'Noto Sans KR',sans-serif;transition:all .15s;}
  .nav-new{background:#fff;border:1.5px solid var(--accent3);color:var(--accent3);}
  .nav-new:hover{background:var(--accent3);color:#fff;}
  .nav-back{background:#fff;border:1.5px solid var(--border);color:var(--text);}
  .nav-back:hover{border-color:var(--point);color:var(--point);}
  .nav-home{background:var(--point);border:1.5px solid var(--point);color:#fff;}
  .nav-home:hover{filter:brightness(1.08);}
  .topbar-divider{width:1px;height:24px;background:var(--border);}
  .topbar-right{display:flex;align-items:center;gap:12px;flex-shrink:0;}
  .tb-user{font-size:12px;color:var(--muted);white-space:nowrap;}
  .tb-user b{color:var(--text);font-weight:700;}
  .add-btn{display:flex;align-items:center;gap:6px;background:var(--point);color:#fff;border:none;
    border-radius:2px;height:30px;padding:0 16px;font-size:12px;font-weight:700;cursor:pointer;
    font-family:'Noto Sans KR',sans-serif;transition:background .15s;white-space:nowrap;}
  .add-btn:hover{background:var(--point-dk);}
  .refresh-tag{font-size:11px;color:var(--muted);white-space:nowrap;}

  /* 국기 */
  .flag{display:inline-block;flex:none;border:1px solid var(--line-lt);vertical-align:middle;}

  /* ── 다가오는 일정 띠 ── */
  .badge-bar{background:var(--surface);border-bottom:1px solid var(--border);
    padding:8px 24px;display:flex;align-items:center;gap:8px;overflow-x:auto;scrollbar-width:none;}
  .badge-bar::-webkit-scrollbar{display:none;}
  .badge-bar-label{font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap;flex-shrink:0;
    padding-right:10px;border-right:1px solid var(--border);}
  .ev-badge{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:2px;
    font-size:12px;font-weight:500;white-space:nowrap;flex-shrink:0;cursor:pointer;
    background:#fff;border:1px solid var(--border);border-left-width:3px;color:var(--text);}
  .ev-badge b{font-weight:700;}
  .ev-badge.b-today{background:var(--point-bg);}
  .badge-empty{font-size:12px;color:var(--locked);}

  /* ── MAIN LAYOUT ── */
  .main-wrap{display:grid;grid-template-columns:1fr 320px;padding:16px 24px 40px;gap:16px;align-items:start;}

  /* ── CALENDAR ── */
  .calendar-wrap{background:var(--surface);padding:16px;border:1px solid var(--border2);}
  .cal-bar{display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap;}
  .cal-nav{display:flex;align-items:center;gap:6px;}
  .cal-nav-btn{width:30px;height:30px;border-radius:2px;border:1px solid var(--border);
    background:#fff;cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;
    color:var(--text);font-family:'Noto Sans KR',sans-serif;}
  .cal-nav-btn:hover{border-color:var(--point);color:var(--point);}
  .cal-today-btn{height:30px;padding:0 12px;border-radius:2px;border:1px solid var(--border);background:#fff;
    font-size:12px;font-weight:700;cursor:pointer;color:var(--text);font-family:'Noto Sans KR',sans-serif;}
  .cal-today-btn:hover{border-color:var(--point);color:var(--point);}
  .cal-month{font-weight:700;font-size:22px;color:var(--text);min-width:128px;text-align:center;letter-spacing:.5px;}
  .cal-filters{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto;}
  .cal-filter{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:2px;border:1px solid var(--border);
    font-size:12px;font-weight:700;cursor:pointer;background:#fff;color:var(--muted);white-space:nowrap;}
  .cal-filter:hover{border-color:var(--point);color:var(--point);}
  .cal-filter.on{background:var(--point);color:#fff;border-color:var(--point);}
  .cal-head{display:grid;grid-template-columns:repeat(7,1fr);border:1px solid var(--border);border-bottom:none;background:var(--bg);}
  .cal-head-cell{text-align:center;font-size:12px;font-weight:700;color:var(--muted);padding:7px 0;border-right:1px solid var(--border);}
  .cal-head-cell:last-child{border-right:none;color:var(--sat);}
  .cal-head-cell:first-child{color:var(--sun);}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);border-left:1px solid var(--border);border-top:1px solid var(--border);}
  .cal-cell{background:#fff;border-right:1px solid var(--border);border-bottom:1px solid var(--border);
    padding:6px 6px 5px;min-height:104px;cursor:pointer;position:relative;display:flex;flex-direction:column;gap:2px;min-width:0;}
  .cal-cell:hover{background:var(--point-bg);}
  .cal-cell.other-month{background:#F6F7F9;cursor:default;}
  .cal-cell.other-month .cal-date{color:var(--locked);font-weight:400;}
  .cal-cell.other-month:hover{background:#F6F7F9;}
  .cal-cell.today{box-shadow:inset 0 0 0 2px var(--point);}
  .cal-cell.selected{background:var(--point-bg);}
  .cal-cell.saturday .cal-date{color:var(--sat);}
  .cal-cell.sunday .cal-date,.cal-cell.is-off .cal-date{color:var(--sun);}
  .cal-date{font-size:13px;font-weight:700;color:var(--text);line-height:22px;height:22px;}
  .cal-cell.today .cal-date,.cal-cell.today.is-off .cal-date{background:var(--point);color:#fff;width:22px;border-radius:50%;text-align:center;font-size:12px;}
  .cell-events{display:flex;flex-direction:column;gap:2px;min-width:0;}
  .cell-event{display:flex;align-items:center;gap:4px;font-size:11.5px;font-weight:500;padding:2px 5px;border-radius:2px;
    border-left:3px solid transparent;line-height:1.45;min-width:0;color:var(--text);}
  .cell-event span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;}
  .cell-more{font-size:11px;color:var(--muted);padding-left:3px;}

  /* ── RIGHT PANEL ── */
  .list-wrap{position:sticky;top:68px;}
  .list-card{background:var(--surface);border:1px solid var(--border2);overflow:hidden;}
  .week-tabs{display:flex;background:var(--bg);border-bottom:1px solid var(--border);}
  .week-tab{flex:1;padding:9px 4px;text-align:center;font-size:12px;font-weight:700;cursor:pointer;
    color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;}
  .week-tab:hover{color:var(--text);}
  .week-tab.on{color:var(--point);border-bottom-color:var(--point);background:var(--surface);}
  .list-header{padding:11px 16px;border-bottom:1px solid var(--border);
    display:flex;align-items:center;justify-content:space-between;background:var(--surface);}
  .list-header-title{font-size:13px;font-weight:700;color:var(--text);}
  .list-header-count{font-size:12px;font-weight:700;color:var(--point);}
  .list-body{max-height:calc(100vh - 290px);overflow-y:auto;}
  .list-item{display:flex;align-items:flex-start;gap:10px;padding:9px 14px;cursor:pointer;
    border-left:3px solid transparent;border-bottom:1px solid var(--line-lt);}
  .list-item:hover{background:var(--point-bg);}
  .list-item.is-active{background:var(--point-bg);border-left-color:var(--point);}
  .list-item.past{opacity:.5;}
  .list-date-block{min-width:44px;flex-shrink:0;line-height:1.3;}
  .list-date-d{font-size:14px;font-weight:700;color:var(--text);}
  .list-date-w{font-size:11px;color:var(--muted);}
  .list-info{flex:1;min-width:0;}
  .list-meta{display:flex;align-items:center;gap:6px;margin-bottom:2px;font-size:11px;color:var(--muted);}
  .list-type{font-weight:700;}
  .list-title{font-size:13px;font-weight:500;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .list-note{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .list-empty{text-align:center;padding:32px 16px;color:var(--locked);font-size:12px;}
  .legend{display:flex;flex-wrap:wrap;gap:6px 12px;padding:10px 14px;border-top:1px solid var(--border);background:var(--bg);}
  .legend-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted);font-weight:500;}
  .legend-dot{width:10px;height:10px;border-radius:2px;}
  .scope-note{padding:10px 14px;border-top:1px solid var(--border);font-size:11px;color:var(--muted);line-height:1.6;background:#fff;}

  /* ── 등록/수정 창 ── */
  .modal-overlay{display:none;position:fixed;inset:0;background:rgba(30,34,37,0.5);
    z-index:500;align-items:center;justify-content:center;}
  .modal-overlay.open{display:flex;}
  .modal-box{background:#fff;border:1px solid var(--border2);width:480px;max-width:95vw;max-height:92vh;overflow-y:auto;}
  .modal-header{background:var(--point);padding:0 18px;height:44px;display:flex;align-items:center;justify-content:space-between;}
  .modal-header-title{font-weight:700;font-size:14px;color:#fff;}
  .modal-close-btn{background:none;border:none;cursor:pointer;color:rgba(255,255,255,0.75);
    font-size:16px;width:30px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:2px;}
  .modal-close-btn:hover{background:rgba(255,255,255,0.15);color:#fff;}
  .modal-body{padding:18px 20px;}

  .form-label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:5px;}
  .form-label .req{color:var(--brand);}
  .form-row{margin-bottom:14px;}
  .form-row-2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px;}
  .form-row-2 .form-row{margin-bottom:0;}
  .form-input{width:100%;height:36px;padding:0 10px;border:1px solid var(--border);border-radius:2px;
    font-size:13px;font-family:'Noto Sans KR',sans-serif;color:var(--text);background:#fff;outline:none;}
  .form-input:focus{border-color:var(--point);}
  .form-input[readonly]{background:var(--bg);color:var(--muted);}
  .form-hint{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.5;}

  .type-btns{display:flex;gap:6px;}
  .type-btn{flex:1;height:36px;border:1px solid var(--border);border-radius:2px;background:#fff;cursor:pointer;
    font-size:13px;font-weight:700;color:var(--muted);font-family:'Noto Sans KR',sans-serif;
    display:flex;align-items:center;justify-content:center;gap:6px;}
  .type-btn i{width:10px;height:10px;border-radius:2px;display:inline-block;}
  .type-btn:hover{border-color:var(--point);color:var(--point);}
  .type-btn.sel{background:var(--point);border-color:var(--point);color:#fff;}

  .entity-tabs{display:flex;gap:6px;}
  .entity-tab{flex:1;height:36px;background:#fff;border:1px solid var(--border);border-radius:2px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:6px;font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap;}
  .entity-tab:hover{border-color:var(--point);color:var(--point);}
  .entity-tab.active{border-color:var(--point);background:var(--point-bg);color:var(--point);box-shadow:inset 0 0 0 1px var(--point);}
  .is-hidden{display:none !important;}

  .btn-row{display:flex;gap:8px;margin-top:18px;align-items:center;}
  .submit-btn{flex:1;height:38px;background:var(--point);color:#fff;border:none;border-radius:2px;
    font-size:13px;font-weight:700;cursor:pointer;font-family:'Noto Sans KR',sans-serif;}
  .submit-btn:hover{background:var(--point-dk);}
  .submit-btn:disabled{opacity:.6;cursor:default;}
  .cancel-btn{width:88px;height:38px;background:#fff;color:var(--text);border:1px solid var(--border);
    border-radius:2px;font-size:13px;font-weight:700;cursor:pointer;font-family:'Noto Sans KR',sans-serif;}
  .cancel-btn:hover{border-color:var(--point);color:var(--point);}
  .del-btn{width:72px;height:38px;background:#fff;color:var(--sun);border:1px solid var(--sun);border-radius:2px;
    font-size:13px;font-weight:700;cursor:pointer;font-family:'Noto Sans KR',sans-serif;display:none;}
  .del-btn.visible{display:block;}
  .del-btn:hover{background:var(--sun);color:#fff;}

  /* 날짜 클릭 창 */
  .day-popup-box{background:#fff;border:1px solid var(--border2);width:420px;max-width:92vw;max-height:88vh;overflow-y:auto;}
  .day-popup-body{padding:16px 18px;}
  .day-ev-list{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;}
  .day-ev-item{display:flex;align-items:center;gap:10px;padding:9px 12px;background:#fff;
    border:1px solid var(--border);border-left-width:3px;border-radius:2px;cursor:pointer;}
  .day-ev-item:hover{background:var(--point-bg);}
  .day-ev-info{flex:1;min-width:0;}
  .day-ev-type{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:var(--muted);margin-bottom:2px;}
  .day-ev-title{font-size:13px;font-weight:500;color:var(--text);word-break:break-all;}
  .day-ev-note{font-size:11px;color:var(--muted);margin-top:2px;word-break:break-all;}
  .day-ev-arrow{font-size:12px;color:var(--locked);white-space:nowrap;}
  .day-new-btn{width:100%;height:38px;background:var(--point);color:#fff;border:none;border-radius:2px;
    font-size:13px;font-weight:700;cursor:pointer;font-family:'Noto Sans KR',sans-serif;}
  .day-new-btn:hover{background:var(--point-dk);}
  .day-empty{text-align:center;padding:14px;color:var(--locked);font-size:12px;}

  .toast{display:none;position:fixed;bottom:28px;left:50%;transform:translateX(-50%);
    background:var(--text);color:#fff;padding:11px 22px;border-radius:2px;
    font-size:13px;font-weight:500;z-index:999;max-width:92vw;}

  @media(max-width:1100px){
    .main-wrap{grid-template-columns:1fr;}
    .list-wrap{position:static;}
    .list-body{max-height:360px;}
  }
</style>

<style id="m-page">

@media screen and (max-width:768px){
.topbar{height:auto!important;min-height:50px;padding:7px 10px!important;flex-wrap:wrap;gap:6px 8px;}
.topbar .brand-id,.topbar .brand-file,.topbar .nav-new,.topbar .tb-user,.topbar .refresh-tag,.topbar .topbar-divider{display:none!important;}
.topbar .brand-name{border-left:0!important;padding-left:0!important;font-size:15px!important;font-weight:700!important;white-space:nowrap;}
.topbar .brand{gap:8px;min-width:0;flex:0 0 auto;}
.topbar .topbar-left{flex:0 0 auto;min-width:0;}
.topbar .topbar-right{flex:1 1 auto;flex-wrap:wrap;justify-content:flex-end;gap:6px!important;min-width:0;}
.topbar .nav-group{gap:6px;}
.topbar .nav-btn,.topbar .add-btn{height:36px!important;padding:0 10px!important;font-size:13px!important;white-space:nowrap;display:inline-flex;align-items:center;}
.badge-bar{overflow-x:auto!important;flex-wrap:nowrap!important;padding:8px 10px!important;gap:6px!important;-webkit-overflow-scrolling:touch;}
.badge-bar > *{flex:0 0 auto;}
.main-wrap{grid-template-columns:1fr!important;padding:10px 10px 24px!important;gap:12px!important;}
.calendar-wrap{padding:10px 6px!important;min-width:0;}
.cal-bar{gap:8px!important;}
.cal-month{font-size:20px!important;min-width:104px!important;}
.cal-nav-btn,.cal-today-btn{height:38px!important;}
.cal-nav-btn{width:38px!important;}
.cal-filters{margin-left:0!important;gap:5px!important;width:100%;}
.cal-filter{height:36px!important;padding:0 9px!important;}
.cal-cell{min-height:72px!important;padding:3px 2px!important;}
.cell-event{padding:1px 2px!important;font-size:10px!important;gap:2px!important;}
.cell-event .flag{display:none;}
.list-wrap{position:static!important;min-width:0;}
.list-body{max-height:none!important;}
.week-tab{padding-top:10px!important;padding-bottom:10px!important;}
.list-item{padding:10px 12px!important;}
.modal-box,.day-popup-box{width:auto!important;max-width:calc(100vw - 12px)!important;max-height:92vh;}
.form-row-2{grid-template-columns:1fr!important;}
.entity-tabs{flex-wrap:wrap;}
.entity-tab{flex:1 1 45%;}
}
</style>

<body data-m-keepfont=".cell-event,.cell-more,.cal-head-cell">

<!-- TOPBAR -->
<div class="topbar">
  <div class="topbar-left">
    <div class="brand">
      <span class="brand-tag">SME</span>
      <div class="brand-id">
        <div class="brand-co">SMEKOREA</div>
        <div class="brand-file">schedule</div>
      </div>
      <span class="brand-name">전법인 통합 일정표</span>
    </div>
  </div>
  <div class="topbar-right">
    <span class="tb-user" id="tbUser"></span>
    <div class="refresh-tag" id="refreshTag"></div>
    <button class="add-btn" onclick="openInputModal()">＋ 일정 등록</button>
    <div class="topbar-divider"></div>
    <div class="nav-group">
      <button class="nav-btn nav-new" onclick="openNewWindow()" title="이 화면을 새 탭에서 엽니다">⧉ 새창열기</button>
      <button class="nav-btn nav-back" onclick="if(history.length>1){history.back();}else{location.href='index.html';}">← 뒤로</button>
      <a class="nav-btn nav-home" href="index.html">⌂ 홈</a>
    </div>
  </div>
</div>

<!-- 다가오는 일정 -->
<div class="badge-bar" id="badgeBar">
  <span class="badge-bar-label">다가오는 일정</span>

<script>
  const SB_URL = 'https://muxuhrbsbrstmrrvlupw.supabase.co';
  const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im11eHVocmJzYnJzdG1ycnZsdXB3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUyNDIwMzMsImV4cCI6MjA5MDgxODAzM30.3Ehqr4l-wcaTXkZNpjHs7K_nr7i8M7gel5DcOG-PPRU';
  const SB_HDR = { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY, 'Content-Type': 'application/json', 'Prefer': 'return=representation' };

  const DAYS_KO = ['일','월','화','수','목','금','토'];
  const TYPES   = ['휴무','당직','공통'];           // 이 화면이 다루는 구분 전부
  const MAX_PERIOD_DAYS = 31;

  // 법인 — 표시 순서: 한국 · 중국 · 태국 · 인도 (메인화면과 동일)

    {code:'HQ',        ko:'한국', label:'한국 HQ',        color:'#B3261E', emp:'KOREA'},

    {code:'GSMEIN',    ko:'인도', label:'인도 GSMEIN',    color:'#C06414', emp:'GSMEIN'}
  ];
  const ENT = {}; ENTITIES.forEach(e => ENT[e.code] = e);
  // :root 의 --c-* 와 같은 값
  const COLOR = { duty:'#5B4B8A', common:'#8A6116' };

  // 국기 — 메인화면(index.html)과 같은 그림
  const FLAG_INNER = {
    HQ:'<rect width="36" height="24" fill="#fff"/><g transform="rotate(33.69 18 12)"><path d="M12 12a6 6 0 0 1 12 0z" fill="#CD2E3A"/><path d="M12 12a6 6 0 0 0 12 0z" fill="#0047A0"/><circle cx="15" cy="12" r="3" fill="#CD2E3A"/><circle cx="21" cy="12" r="3" fill="#0047A0"/></g><g stroke="#000" stroke-width="1" fill="none"><path transform="translate(18 12) rotate(213.69) translate(11 0)" d="M-1.5 -3V3M0 -3V3M1.5 -3V3"/><path transform="translate(18 12) rotate(33.69) translate(11 0)" d="M-1.5 -3V-.3M-1.5 .3V3M0 -3V-.3M0 .3V3M1.5 -3V-.3M1.5 .3V3"/><path transform="translate(18 12) rotate(-33.69) translate(11 0)" d="M-1.5 -3V-.3M-1.5 .3V3M0 -3V3M1.5 -3V-.3M1.5 .3V3"/><path transform="translate(18 12) rotate(146.31) translate(11 0)" d="M-1.5 -3V3M0 -3V-.3M0 .3V3M1.5 -3V3"/></g>',
    SMECN:'<rect width="36" height="24" fill="#EE1C25"/><g fill="#FFFF00"><polygon transform="translate(6 6) scale(3.6)" points="0,-1 0.225,-0.309 0.951,-0.309 0.363,0.118 0.588,0.809 0,0.382 -0.588,0.809 -0.363,0.118 -0.951,-0.309 -0.225,-0.309"/><polygon transform="translate(12 2.4) scale(1.2)" points="0,-1 0.225,-0.309 0.951,-0.309 0.363,0.118 0.588,0.809 0,0.382 -0.588,0.809 -0.363,0.118 -0.951,-0.309 -0.225,-0.309"/><polygon transform="translate(14.4 4.8) scale(1.2)" points="0,-1 0.225,-0.309 0.951,-0.309 0.363,0.118 0.588,0.809 0,0.382 -0.588,0.809 -0.363,0.118 -0.951,-0.309 -0.225,-0.309"/><polygon transform="translate(14.4 8.4) scale(1.2)" points="0,-1 0.225,-0.309 0.951,-0.309 0.363,0.118 0.588,0.809 0,0.382 -0.588,0.809 -0.363,0.118 -0.951,-0.309 -0.225,-0.309"/><polygon transform="translate(12 10.8) scale(1.2)" points="0,-1 0.225,-0.309 0.951,-0.309 0.363,0.118 0.588,0.809 0,0.382 -0.588,0.809 -0.363,0.118 -0.951,-0.309 -0.225,-0.309"/></g>',
    SMEGLOBAL:'<rect width="36" height="24" fill="#A51931"/><rect y="4" width="36" height="16" fill="#F4F5F8"/><rect y="8" width="36" height="8" fill="#2D2A4A"/>',
    GSMEIN:'<rect width="36" height="24" fill="#fff"/><rect width="36" height="8" fill="#FF9933"/><rect y="16" width="36" height="8" fill="#138808"/><g stroke="#000080" fill="none"><circle cx="18" cy="12" r="3.1" stroke-width=".6"/><path stroke-width=".3" d="M18 8.9v6.2M14.9 12h6.2M15.8 9.8l4.4 4.4M20.2 9.8l-4.4 4.4M16.8 9.1l2.4 5.8M19.2 9.1l-2.4 5.8M15.1 10.8l5.8 2.4M20.9 10.8l-5.8 2.4"/></g>'
  };
  function flag(code, h){
    if(!FLAG_INNER[code]) return '';
    h = h || 12;
    return `<svg class="flag" width="${h*1.5}" height="${h}" viewBox="0 0 36 24" role="img" aria-label="${esc((ENT[code]||{}).ko||code)} 국기">${FLAG_INNER[code]}</svg>`;
  }

  // 로그인 정보 — 메인화면에서 로그인하면 저장된다 (다른 화면과 같은 키)
  let curUser = '', curEntity = '';
  try{
    if(localStorage.getItem('sme_auth')==='1') curUser = localStorage.getItem('sme_user') || '';
    curEntity = localStorage.getItem('sme_entity') || '';
  }catch(_){}
  const MY_ENTITY = ({KOREA:'HQ',SMECN:'SMECN',SMEGLOBAL:'SMEGLOBAL',GSMEIN:'GSMEIN'})[curEntity] || 'HQ';

  let viewYear, viewMonth, allEvents = [], employees = [];
  let activeFilter = 'ALL', activeWeek = 'ALL', selectedDate = null, refreshTimer;
  let selectedEntity = 'HQ', selectedType = '', isEditMode = false, editEventId = null, dayPopupDate = null;

  function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
  function pad(n){ return String(n).padStart(2,'0'); }
  function ymd(d){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
  function parseYmd(s){ const p=String(s).split('-'); return new Date(+p[0], +p[1]-1, +p[2]); }
  function kstNow(){ const n=new Date(); return new Date(n.getTime()+n.getTimezoneOffset()*60000+9*3600000); }
  function todayStr(){ return ymd(kstNow()); }

  function openNewWindow(){
    const w = window.open(location.href, '_blank');
    if(!w) alert('팝업이 차단되어 새 탭을 열 수 없습니다.\n주소창의 팝업 차단 아이콘에서 허용해주세요.');
  }

  // 일정 한 건의 색·표시 문구
  function evColor(e){
    if(e.type==='당직') return COLOR.duty;
    if(e.type==='공통') return COLOR.common;
    return (ENT[e.entity]||{}).color || COLOR.common;
  }
  function tint(hex){ // 칩 배경용 옅은 색
    const n=parseInt(hex.slice(1),16);
    return `rgba(${n>>16},${(n>>8)&255},${n&255},0.10)`;
  }
  function evLabel(e){
    if(e.type==='당직') return '당직 · ' + (e.duty || e.title || '');
    return e.title || '';
  }
  function evWho(e){ return e.type==='공통' ? '전 법인 공통' : ((ENT[e.entity]||{}).label || e.entity || ''); }
  function evFlag(e, h){ return e.type==='공통' ? '' : flag(e.entity, h); }

  // ── Supabase ──
  async function sbFetch(path, opt){
    const res = await fetch(`${SB_URL}/rest/v1/${path}`, Object.assign({ headers: SB_HDR }, opt||{}));
    if(!res.ok){ let m=''; try{ m=(await res.json()).message||''; }catch(_){ } throw new Error(m || ('HTTP '+res.status)); }
    if(res.status===204) return null;
    const txt = await res.text();
    return txt ? JSON.parse(txt) : null;
  }
  const q = encodeURIComponent;

  async function loadEmployees(){
    try{
      const rows = await sbFetch('employees?select=name,dept,emp_no,entity&active=eq.true&order=emp_no&limit=500');
      employees = Array.isArray(rows) ? rows : [];
    }catch(e){ employees = []; }
  }

  // ── 데이터 로드 ──
  async function loadEvents(){
    let ok = true, cal = [];
    try{
      cal = await sbFetch(`sme_calendar?select=id,event_date,entity,type,title,duty,writer,note&type=in.(${TYPES.map(q).join(',')})&order=event_date.asc,id.asc&limit=2000`) || [];
    }catch(e){ ok = false; }
    // 이 화면은 sme_calendar 에 직접 등록한 것만 보여 준다.
    // 업무보고(지시사항)의 「행사·일정」은 본사 내부 건이라 끌어오지 않는다 (v15.76 — 연동 제거).
    if(!ok){ showToast('일정을 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.'); return; }
    allEvents = cal.map(r => ({
      id:r.id, date:String(r.event_date).slice(0,10), entity:r.entity, type:r.type,
      title:r.title, duty:r.duty, writer:r.writer, note:r.note, src:'cal'
    }));
    allEvents.sort((a,b)=>a.date.localeCompare(b.date));
    renderAll();
    const k = kstNow();
    document.getElementById('refreshTag').textContent = `갱신 ${pad(k.getHours())}:${pad(k.getMinutes())}`;
  }
  function renderAll(){ renderBadgeBar(); renderCalendar(); renderList(); }

  // ── 필터/탭 ──
  function filtered(evs){ return activeFilter==='ALL' ? evs : evs.filter(e => e.type==='공통' || e.entity===activeFilter); }
  function renderFilters(){
    const items = [{code:'ALL',html:'전체'}].concat(ENTITIES.map(e => ({code:e.code, html:flag(e.code,12)+esc(e.ko)})));
    document.getElementById('calFilters').innerHTML = items.map(i =>
      `<span class="cal-filter${i.code===activeFilter?' on':''}" data-f="${i.code}" onclick="setFilter('${i.code}')">${i.html}</span>`).join('');
  }
  function setFilter(code){ activeFilter = code; renderFilters(); renderAll(); }
  function switchWeek(el){
    document.querySelectorAll('.week-tab').forEach(x=>x.classList.remove('on'));
    el.classList.add('on'); activeWeek = el.dataset.w; renderList();
  }
  function resetWeekTab(){
    activeWeek='ALL';
    document.querySelectorAll('.week-tab').forEach(x=>x.classList.toggle('on', x.dataset.w==='ALL'));
  }
  function getWeekOfMonth(ds){
    const d = parseYmd(ds); const first = new Date(d.getFullYear(), d.getMonth(), 1);
    return Math.ceil((d.getDate()+first.getDay())/7);
  }
  function renderLegend(){
    const items = ENTITIES.map(e => ({c:e.color, n:e.ko+' 휴무'})).concat([{c:COLOR.duty,n:'당직'},{c:COLOR.common,n:'공통'}]);
    document.getElementById('legend').innerHTML = items.map(i =>
      `<div class="legend-item"><div class="legend-dot" style="background:${i.c}"></div>${esc(i.n)}</div>`).join('');
  }

  // ── 달력 날짜 클릭 ──
  function selectDay(ds){
    selectedDate = ds;
    document.querySelectorAll('.cal-cell').forEach(c=>c.classList.toggle('selected', c.dataset.date===ds));
    renderList();
    openDayPopup(ds);
  }
  function openDayPopup(ds){
    dayPopupDate = ds;
    const d = parseYmd(ds);
    const evs = allEvents.filter(e => e.date===ds);
    document.getElementById('dayPopupDateLabel').textContent =
      `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일 (${DAYS_KO[d.getDay()]})`;
    document.getElementById('dayEvList').innerHTML = evs.length
      ? evs.map(e => {
          return `<div class="day-ev-item" style="border-left-color:${evColor(e)}" onclick="openEvent('${e.id}')">
            <div class="day-ev-info">
              <div class="day-ev-type">${evFlag(e,11)}<span>${esc(evWho(e))} · ${esc(e.type)}</span></div>
              <div class="day-ev-title">${esc(evLabel(e))}</div>
              ${e.note?`<div class="day-ev-note">${esc(e.note)}</div>`:''}
            </div>
            <div class="day-ev-arrow">수정 →</div>
          </div>`;
        }).join('')
      : '<div class="day-empty">이 날짜에 등록된 일정이 없습니다</div>';
    document.getElementById('dayPopup').classList.add('open');
  }
  function closeDayPopup(){ document.getElementById('dayPopup').classList.remove('open'); }
  function openInputFromDay(){ closeDayPopup(); openInputModal(dayPopupDate); }

  // 일정 열기 (수정 창)
  function openEvent(id){
    const ev = allEvents.find(e => String(e.id)===String(id));
    if(!ev) return;
    closeDayPopup();
    openInputModal(null, ev);
  }

  // ── 등록/수정 창 ──
  function renderEntityTabs(){
    document.getElementById('entityTabs').innerHTML = ENTITIES.map(e =>
      `<div class="entity-tab${e.code===selectedEntity?' active':''}" data-entity="${e.code}" onclick="selectEntity('${e.code}')">${flag(e.code,12)}${esc(e.ko)}</div>`).join('');
  }
  function selectEntity(code){ selectedEntity = code; renderEntityTabs(); fillDutyOptions(); }

  // 당직자 — 해당 법인 직원 목록에서 선택. 직원이 등록되지 않은 법인은 직접 입력.
  function fillDutyOptions(keep){
    const sel = document.getElementById('fDutySel'), inp = document.getElementById('fDuty');
    const cur = keep!==undefined ? keep : (sel.classList.contains('is-hidden') ? inp.value.trim() : sel.value);
    const empKey = (ENT[selectedEntity]||{}).emp;
    const list = employees.filter(e => e.entity===empKey);
    if(!list.length){
      sel.classList.add('is-hidden'); inp.classList.remove('is-hidden'); inp.value = cur||'';
      return;
    }
    inp.classList.add('is-hidden'); sel.classList.remove('is-hidden');
    let html = '<option value="">선택하세요</option>' +
      list.map(e => `<option value="${esc(e.name)}">${esc(e.name)}${e.dept?' ('+esc(e.dept)+')':''}</option>`).join('') +
      '<option value="당직생략">당직생략</option>';
    if(cur && cur!=='당직생략' && !list.some(e => e.name===cur)) html += `<option value="${esc(cur)}">${esc(cur)}</option>`;
    sel.innerHTML = html; sel.value = cur||'';
  }
  function getDuty(){
    const sel = document.getElementById('fDutySel'), inp = document.getElementById('fDuty');
    return (sel.classList.contains('is-hidden') ? inp.value : sel.value).trim();
  }

  const TYPE_HINT = {
    '휴무':'법인 전체가 쉬는 날 (공휴일·연휴·법인 휴무). 개인 연차·반차는 워크플로우에 등록합니다.',
    '당직':'토요일 등 당직 근무일과 당직자.',
    '공통':'창립기념일처럼 전 법인이 함께 알아야 하는 일정.'
  };
  const TYPE_DEFAULT_TITLE = {'휴무':'', '당직':'당직', '공통':''};
  function selectType(el){
    const type = el.dataset.type;
    selectedType = type;
    document.querySelectorAll('.type-btn').forEach(b=>b.classList.toggle('sel', b===el));
    document.getElementById('typeHint').textContent = TYPE_HINT[type]||'';
    document.getElementById('dutyRow').classList.toggle('is-hidden', type!=='당직');
    document.getElementById('entityRow').classList.toggle('is-hidden', type==='공통');
    const titleEl = document.getElementById('fTitle');
    const cur = titleEl.value.trim();
    if(!cur || cur==='당직') titleEl.value = TYPE_DEFAULT_TITLE[type]||'';
    if(type==='당직') fillDutyOptions();
  }

  function onStartChange(){
    const s = document.getElementById('fDate').value, endEl = document.getElementById('fEnd');
    endEl.min = s || '';
    if(endEl.value && s && endEl.value < s) endEl.value = '';
    updatePeriodHint();
  }
  function periodDates(){
    const s = document.getElementById('fDate').value, e = document.getElementById('fEnd').value;
    if(!s) return [];
    if(isEditMode || !e || e<=s) return [s];
    const out = []; const d = parseYmd(s), end = parseYmd(e);
    while(d<=end && out.length<=MAX_PERIOD_DAYS){ out.push(ymd(d)); d.setDate(d.getDate()+1); }
    return out;
  }
  function updatePeriodHint(){
    const el = document.getElementById('periodHint'); const n = periodDates().length;
    if(isEditMode || n<=1){ el.classList.add('is-hidden'); return; }
    el.classList.remove('is-hidden');
    el.textContent = n>MAX_PERIOD_DAYS ? `기간은 최대 ${MAX_PERIOD_DAYS}일까지 등록할 수 있습니다.`
      : `${n}일간 — 날짜마다 같은 내용으로 ${n}건이 등록됩니다. 등록 후 날짜별로 수정·삭제할 수 있습니다.`;
  }

  function openInputModal(preDate, editEv){
    isEditMode = !!editEv;
    editEventId = editEv ? editEv.id : null;
    selectedType = '';
    document.querySelectorAll('.type-btn').forEach(b=>b.classList.remove('sel'));
    document.getElementById('typeHint').textContent = '';
    document.getElementById('dutyRow').classList.add('is-hidden');
    document.getElementById('entityRow').classList.remove('is-hidden');
    document.getElementById('modalModeLabel').textContent = isEditMode ? '일정 수정' : '일정 등록';
    document.getElementById('submitBtn').textContent = isEditMode ? '저장' : '등록';
    document.getElementById('submitBtn').disabled = false;
    document.getElementById('delBtn').classList.toggle('visible', isEditMode);
    document.getElementById('endRow').classList.toggle('is-hidden', isEditMode);
    document.getElementById('fEnd').value = '';

    const writerEl = document.getElementById('fWriter');
    if(isEditMode){
      selectedEntity = ENT[editEv.entity] ? editEv.entity : 'HQ';
      document.getElementById('fDate').value  = editEv.date  || '';
      document.getElementById('fTitle').value = editEv.title || '';
      document.getElementById('fNote').value  = editEv.note  || '';
      writerEl.value = editEv.writer || curUser || '';
      writerEl.readOnly = !!writerEl.value;       // 등록자는 처음 등록한 사람 그대로 둔다
      renderEntityTabs();
      fillDutyOptions(editEv.duty || '');
      const btn = document.querySelector(`.type-btn[data-type="${editEv.type}"]`);
      if(btn) selectType(btn);
    } else {
      selectedEntity = MY_ENTITY;
      document.getElementById('fDate').value  = preDate || todayStr();
      document.getElementById('fTitle').value = '';
      document.getElementById('fNote').value  = '';
      writerEl.value = curUser; writerEl.readOnly = !!curUser;
      renderEntityTabs();
      fillDutyOptions('');
    }
    onStartChange();
    document.getElementById('inputModal').classList.add('open');
  }
  function closeInputModal(){ document.getElementById('inputModal').classList.remove('open'); }

  // ── 등록/수정 실행 ──
  async function submitSchedule(){
    const date   = document.getElementById('fDate').value;
    const title  = document.getElementById('fTitle').value.trim();
    const writer = document.getElementById('fWriter').value.trim();
    const note   = document.getElementById('fNote').value.trim();
    const duty   = selectedType==='당직' ? getDuty() : '';

    if(!selectedType) return showToast('구분을 선택해 주세요');
    if(!date)         return showToast('날짜를 선택해 주세요');
    if(selectedType==='당직' && !duty) return showToast('당직자를 선택해 주세요');
    if(!title)        return showToast('제목을 입력해 주세요');
    if(!writer)       return showToast('등록자를 입력해 주세요');
    const dates = periodDates();
    if(dates.length>MAX_PERIOD_DAYS) return showToast(`기간은 최대 ${MAX_PERIOD_DAYS}일까지 등록할 수 있습니다`);

    const base = {
      entity: selectedType==='공통' ? 'HQ' : selectedEntity,
      type:   selectedType,
      title:  title,
      duty:   duty || null,
      note:   note || null
    };
    // 같은 날·같은 법인·같은 구분·같은 제목이 이미 있으면 다시 넣지 않는다 (중복 등록 방지)
    const isDup = d => allEvents.some(e => e.src==='cal' && e.date===d && e.entity===base.entity && e.type===base.type
      && (e.title||'')===title && (e.duty||'')===(duty||'') && String(e.id)!==String(editEventId));

    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    try{
      if(isEditMode && editEventId){
        if(isDup(date)){ btn.disabled=false; return showToast('같은 날짜에 같은 일정이 이미 있습니다'); }
        await sbFetch(`sme_calendar?id=eq.${encodeURIComponent(editEventId)}`, { method:'PATCH', body:JSON.stringify(Object.assign({event_date:date}, base)) });
        showToast('수정되었습니다');
      } else {
        const fresh = dates.filter(d => !isDup(d));
        if(!fresh.length){ btn.disabled=false; return showToast('같은 날짜에 같은 일정이 이미 있습니다'); }
        const now = new Date().toISOString();
        const rows = fresh.map(d => Object.assign({event_date:d, writer:writer, created_at:now}, base));
        await sbFetch('sme_calendar', { method:'POST', body:JSON.stringify(rows) });
        const skipped = dates.length - fresh.length;
        showToast(fresh.length>1 ? `${fresh.length}건 등록되었습니다${skipped?` (이미 있는 ${skipped}건 제외)`:''}` : '등록되었습니다');
      }
      closeInputModal();
      await loadEvents();
    }catch(e){
      showToast('저장하지 못했습니다. 잠시 후 다시 시도해 주세요.');
    }
    btn.disabled = false;
  }

  // ── 삭제 ──
  async function deleteEvent(){
    if(!editEventId) return;
    if(!confirm('정말 삭제하시겠습니까?')) return;
    try{
      await sbFetch(`sme_calendar?id=eq.${encodeURIComponent(editEventId)}`, { method:'DELETE', headers:Object.assign({}, SB_HDR, {'Prefer':'return=minimal'}) });
      showToast('삭제되었습니다');
      closeInputModal();
      await loadEvents();
    }catch(e){ showToast('삭제하지 못했습니다. 잠시 후 다시 시도해 주세요.'); }
  }

  // ── 렌더 ──
  function renderBadgeBar(){
    const today = todayStr();
    const upcoming = filtered(allEvents).filter(e => e.date>=today).slice(0,12);
    const bar = document.getElementById('badgeBar');
    const head = '<span class="badge-bar-label">다가오는 일정</span>';
    if(!upcoming.length){ bar.innerHTML = head + '<span class="badge-empty">등록된 일정 없음</span>'; return; }
    bar.innerHTML = head + upcoming.map(e => {
      const d = parseYmd(e.date);
      return `<span class="ev-badge${e.date===today?' b-today':''}" style="border-left-color:${evColor(e)}" onclick="openEvent('${e.id}')">${evFlag(e,11)}<b>${d.getMonth()+1}/${d.getDate()}(${DAYS_KO[d.getDay()]})</b>${esc(evLabel(e))}</span>`;
    }).join('');
  }

  function changeMonth(d){
    viewMonth += d;
    if(viewMonth>11){ viewMonth=0; viewYear++; } if(viewMonth<0){ viewMonth=11; viewYear--; }
    selectedDate = null; resetWeekTab();
    renderCalendar(); renderList();
  }
  function goToday(){
    const k = kstNow(); viewYear = k.getFullYear(); viewMonth = k.getMonth();
    selectedDate = null; resetWeekTab();
    renderCalendar(); renderList();
  }

  function renderCalendar(){
    const mo = pad(viewMonth+1);
    document.getElementById('calMonth').textContent = `${viewYear}년 ${viewMonth+1}월`;
    const first = new Date(viewYear,viewMonth,1), last = new Date(viewYear,viewMonth+1,0);
    const startDay = first.getDay();
    const today = todayStr();
    const evMap = {};
    filtered(allEvents).forEach(e => { (evMap[e.date]=evMap[e.date]||[]).push(e); });
    let html = '';
    for(let i=0;i<startDay;i++){
      const d = new Date(viewYear,viewMonth,1-startDay+i);
      html += `<div class="cal-cell other-month"><span class="cal-date">${d.getDate()}</span></div>`;
    }
    for(let d=1; d<=last.getDate(); d++){
      const ds = `${viewYear}-${mo}-${pad(d)}`;
      const dow = (startDay+d-1)%7;
      const evs = evMap[ds]||[];
      const isOff = evs.some(e => e.type==='휴무' && e.entity===MY_ENTITY);   // 내 법인이 쉬는 날은 날짜를 붉게
      const cls = `cal-cell${ds===today?' today':''}${dow===0?' sunday':dow===6?' saturday':''}${isOff?' is-off':''}${selectedDate===ds?' selected':''}`;
      const show = evs.slice(0,3), more = evs.length-3;
      const evHtml = show.map(e => {
        const c = evColor(e);
        return `<div class="cell-event" style="background:${tint(c)};border-left-color:${c}" title="${esc(evWho(e)+' · '+evLabel(e))}">${evFlag(e,10)}<span>${esc(evLabel(e))}</span></div>`;
      }).join('');
      html += `<div class="${cls}" data-date="${ds}" onclick="selectDay('${ds}')">
        <span class="cal-date">${d}</span>
        <div class="cell-events">${evHtml}${more>0?`<div class="cell-more">+${more}건</div>`:''}</div>
      </div>`;
    }
    const rem = (7-((startDay+last.getDate())%7))%7;
    for(let i=1;i<=rem;i++) html += `<div class="cal-cell other-month"><span class="cal-date">${i}</span></div>`;
    document.getElementById('calGrid').innerHTML = html;
  }

  function renderList(){
    const prefix = `${viewYear}-${pad(viewMonth+1)}`;
    const today = todayStr();
    let evs = filtered(allEvents).filter(e => e.date.startsWith(prefix));
    if(activeWeek!=='ALL') evs = evs.filter(e => getWeekOfMonth(e.date)===parseInt(activeWeek,10));
    document.getElementById('listTitle').textContent =
      activeWeek==='ALL' ? `${viewYear}년 ${viewMonth+1}월 전체` : `${viewYear}년 ${viewMonth+1}월 ${activeWeek}주차`;
    document.getElementById('listCount').textContent = `${evs.length}건`;
    const body = document.getElementById('listBody');
    if(!evs.length){ body.innerHTML = '<div class="list-empty">등록된 일정이 없습니다</div>'; return; }
    body.innerHTML = evs.map(e => {
      const d = parseYmd(e.date);
      return `<div class="list-item${e.date<today?' past':''}${selectedDate===e.date?' is-active':''}" style="border-left-color:${evColor(e)}" onclick="openEvent('${e.id}')">
        <div class="list-date-block">
          <div class="list-date-d">${d.getMonth()+1}/${d.getDate()}</div>
          <div class="list-date-w">${DAYS_KO[d.getDay()]}요일</div>
        </div>
        <div class="list-info">
          <div class="list-meta">${evFlag(e,11)}<span>${esc(evWho(e))}</span><span class="list-type" style="color:${evColor(e)}">${esc(e.type)}</span></div>
          <div class="list-title">${esc(evLabel(e))}</div>
          ${e.note?`<div class="list-note">${esc(e.note)}</div>`:''}
        </div>
      </div>`;
    }).join('');
  }

  let toastTimer;
  function showToast(msg){
    const el = document.getElementById('toast');
    el.textContent = msg; el.style.display = 'block';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=>{ el.style.display='none'; }, 2800);
  }

  // ESC / 바깥 클릭
  document.addEventListener('keydown', e => { if(e.key==='Escape'){ closeInputModal(); closeDayPopup(); } });
  document.getElementById('inputModal').addEventListener('click', function(e){ if(e.target===this) closeInputModal(); });
  document.getElementById('dayPopup').addEventListener('click', function(e){ if(e.target===this) closeDayPopup(); });

  // ── 초기화 ──
  (function init(){
    const k = kstNow();
    viewYear = k.getFullYear(); viewMonth = k.getMonth();
    document.getElementById('tbUser').innerHTML = curUser ? `<b>${esc(curUser)}</b> 님` : '';
    renderFilters(); renderLegend(); renderCalendar(); renderList();
    loadEmployees();
    loadEvents();
    // 5분마다 새로 불러온다. 창을 열어 입력 중일 때는 건너뛴다.
    refreshTimer = setInterval(function(){
      if(document.querySelector('.modal-overlay.open')) return;
      loadEvents();
    }, 300000);
  })();
</script>
</body>
