name: Coin Signal Hourly Scan

on:
  schedule:
    - cron: '*/15 * * * *'   # 15분마다
  workflow_dispatch:        # 수동 실행 버튼 (테스트용)

concurrency:
  group: coin-signal-scan
  cancel-in-progress: false  # 이전 실행이 끝날 때까지 대기 (동시중복 방지)

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run coin signal scan
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/coin_signal_scan.py
