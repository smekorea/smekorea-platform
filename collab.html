<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SMERP 협업개발 · SME Korea</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Share+Tech+Mono&family=Barlow+Condensed:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{
  --hdr:#2c2420; --hdr-bdr:rgba(255,255,255,.08);
  --bg:#f0ede8; --surf:#ffffff; --surf2:#f7f4ef;
  --tbl-hd:#ece8e2; --bdr:#ddd8d0; --bdr2:#c8c0b4;
  --t1:#1a1612; --t2:#5a5048; --t3:#8a7e72;
  --red:#c8001e; --blue:#1a4fa0; --green:#1e7a45;
  --orange:#f87171; --accent:#f97316;
  --hdr-h:56px; --panel-w:400px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--t1);}

/* ── 헤더 ── */
.topbar{
  position:sticky;top:0;z-index:200;
  background:var(--hdr);border-bottom:1px solid var(--hdr-bdr);
  display:flex;align-items:center;height:var(--hdr-h);padding:0 20px;gap:16px;
}
.tb-logo{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:28px;color:var(--red);letter-spacing:-0.5px;}
.tb-sub{font-size:11px;color:var(--orange);letter-spacing:1px;margin-top:2px;}
.tb-title{color:rgba(255,255,255,.6);font-size:13px;margin-left:4px;}
.tb-spacer{flex:1;}
.tb-user{color:rgba(255,255,255,.55);font-size:12px;}
.tb-back{
  background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);
  color:rgba(255,255,255,.8);font-size:12px;padding:6px 14px;border-radius:6px;
  cursor:pointer;text-decoration:none;font-family:'Noto Sans KR',sans-serif;transition:background .15s;
}
.tb-back:hover{background:rgba(255,255,255,.18);}

/* ── 탭 ── */
.tab-bar{display:flex;border-bottom:2px solid var(--bdr);background:var(--surf);padding:0 24px;}
.tab-btn{
  padding:11px 22px;font-size:13px;font-weight:500;cursor:pointer;
  border:none;background:none;color:var(--t3);border-bottom:2px solid transparent;
  margin-bottom:-2px;transition:color .15s;font-family:'Noto Sans KR',sans-serif;
}
.tab-btn:hover{color:var(--t1);}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent);}

/* ── 레이아웃: 목록+사이드패널 ── */
.list-layout{display:flex;height:calc(100vh - var(--hdr-h) - 44px);overflow:hidden;}
.list-area{flex:1;overflow:auto;padding:16px 20px;min-width:0;}
.side-panel{
  width:var(--panel-w);flex-shrink:0;border-left:1px solid var(--bdr);
  background:var(--surf);overflow-y:auto;
  transform:translateX(var(--panel-w));transition:transform .2s;
}
.side-panel.open{transform:translateX(0);}

/* ── 필터바 ── */
.filter-bar{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap;}
.filter-bar select,.filter-bar input{
  height:30px;padding:0 9px;border:1px solid var(--bdr2);border-radius:6px;
  background:var(--surf);font-size:12px;color:var(--t1);font-family:'Noto Sans KR',sans-serif;
}
.filter-bar select{cursor:pointer;}
.btn{
  height:30px;padding:0 13px;border-radius:6px;border:none;
  font-size:12px;font-family:'Noto Sans KR',sans-serif;cursor:pointer;font-weight:500;transition:opacity .15s;
}
.btn:hover{opacity:.85;}
.btn-primary{background:var(--accent);color:#fff;}
.btn-outline{background:var(--surf);border:1px solid var(--bdr2);color:var(--t2);}
.cnt-badge{
  margin-left:auto;font-size:12px;color:var(--t3);
  background:var(--surf2);padding:3px 10px;border-radius:12px;border:1px solid var(--bdr);
}

/* ── 테이블 ── */
.tbl-wrap{background:var(--surf);border:1px solid var(--bdr);border-radius:8px;overflow:auto;}
table{width:100%;border-collapse:collapse;table-layout:fixed;}
thead th{
  background:var(--tbl-hd);font-size:11px;font-weight:600;color:var(--t2);
  padding:7px 10px;text-align:left;white-space:nowrap;overflow:hidden;
  position:sticky;top:0;z-index:5;user-select:none;border-bottom:1px solid var(--bdr2);
}
thead th.sortable{cursor:pointer;}
thead th.sortable:hover{background:#e4e0d8;}
.sort-icon{margin-left:3px;color:var(--t3);}
tbody td{
  padding:7px 10px;font-size:12px;color:#111827;
  border-bottom:1px solid var(--bdr);vertical-align:middle;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  border-right:1px solid #e8edf5;cursor:pointer;
}
tbody td:last-child{border-right:none;}
tbody tr:hover td{background:#f5f2ee;}
tbody tr.selected td{background:#fff7ed;}
tbody tr:last-child td{border-bottom:none;}
.col-resizer{position:absolute;right:0;top:0;bottom:0;width:5px;cursor:col-resize;z-index:1;}
.col-resizer:hover,.col-resizer.dragging{background:rgba(249,115,22,.4);}

/* ── 배지 ── */
.badge{display:inline-block;padding:2px 7px;border-radius:10px;font-size:11px;font-weight:500;}
.badge-접수{background:#e0f2fe;color:#0369a1;}
.badge-검토중{background:#fef9c3;color:#854d0e;}
.badge-개발중{background:#ede9fe;color:#6d28d9;}
.badge-완료{background:#dcfce7;color:#166534;}
.badge-보류{background:#f1f5f9;color:#64748b;}
.badge-높음{background:#fee2e2;color:#991b1b;}
.badge-보통{background:#f1f5f9;color:#475569;}
.badge-낮음{background:#f0fdf4;color:#15803d;}

/* ── 사이드 패널 내부 ── */
.sp-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 16px;border-bottom:1px solid var(--bdr);
  position:sticky;top:0;background:var(--surf);z-index:10;
}
.sp-header h3{font-size:13px;font-weight:600;color:var(--t1);}
.sp-close{
  width:26px;height:26px;border:none;background:var(--surf2);
  border-radius:6px;cursor:pointer;font-size:14px;color:var(--t3);
  display:flex;align-items:center;justify-content:center;
}
.sp-close:hover{background:var(--bdr);color:var(--t1);}
.sp-body{padding:16px;}
.sp-row{margin-bottom:13px;}
.sp-label{font-size:11px;color:var(--t3);font-weight:500;margin-bottom:4px;}
.sp-value{font-size:12px;color:var(--t1);line-height:1.5;}
.sp-content{
  background:var(--surf2);border:1px solid var(--bdr);border-radius:6px;
  padding:9px 11px;font-size:12px;line-height:1.6;color:var(--t1);
  white-space:pre-wrap;max-height:140px;overflow-y:auto;
}
.sp-sep{border:none;border-top:1px solid var(--bdr);margin:14px 0;}
.sp-input{
  width:100%;padding:7px 10px;border:1px solid var(--bdr2);border-radius:6px;
  font-size:12px;font-family:'Noto Sans KR',sans-serif;color:var(--t1);
  background:var(--surf);margin-bottom:7px;
}
.sp-input:focus{outline:none;border-color:#6d28d9;}
.sp-select{
  width:100%;padding:7px 10px;border:1px solid var(--bdr2);border-radius:6px;
  font-size:12px;font-family:'Noto Sans KR',sans-serif;color:var(--t1);
  background:var(--surf);margin-bottom:7px;cursor:pointer;
}
.sp-select:focus{outline:none;border-color:#6d28d9;}
.sp-textarea{
  width:100%;padding:7px 10px;border:1px solid var(--bdr2);border-radius:6px;
  font-size:12px;font-family:'Noto Sans KR',sans-serif;color:var(--t1);
  background:var(--surf);resize:vertical;min-height:80px;line-height:1.5;
  margin-bottom:7px;
}
.sp-textarea:focus{outline:none;border-color:#6d28d9;}
.sp-section-title{
  font-size:11px;font-weight:600;color:var(--t2);
  text-transform:uppercase;letter-spacing:.5px;
  margin-bottom:10px;
}

/* ── 폼 탭 ── */
.main-pad{padding:20px 24px;}
.form-card{background:var(--surf);border:1px solid var(--bdr);border-radius:8px;padding:26px 30px;max-width:700px;}
.form-row{margin-bottom:16px;}
.form-label{display:block;font-size:12px;font-weight:600;color:var(--t2);margin-bottom:5px;}
.form-label span{color:var(--red);margin-left:2px;}
.form-input,.form-select,.form-textarea{
  width:100%;padding:8px 12px;border:1px solid var(--bdr2);border-radius:6px;
  font-size:13px;font-family:'Noto Sans KR',sans-serif;color:var(--t1);
  background:var(--surf);transition:border .15s;
}
.form-input:focus,.form-select:focus,.form-textarea:focus{outline:none;border-color:var(--accent);}
.form-textarea{resize:vertical;min-height:110px;line-height:1.6;}
.form-row-2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.form-hint{font-size:11px;color:var(--t3);margin-top:3px;}
.form-footer{display:flex;gap:10px;margin-top:20px;}

/* ── 탭 패널 ── */
.tab-panel{display:none;}
.tab-panel.active{display:block;}

/* ── 빈 상태 ── */
.empty{text-align:center;padding:50px 20px;color:var(--t3);}
.empty-icon{font-size:36px;margin-bottom:10px;}
.empty-msg{font-size:13px;}
.sp-empty{text-align:center;padding:40px 20px;color:var(--t3);}
.sp-empty-icon{font-size:32px;margin-bottom:8px;}
.sp-empty-msg{font-size:12px;line-height:1.6;}

/* ── 토스트 ── */
.toast{
  position:fixed;bottom:24px;right:24px;z-index:9999;
  background:#1a1612;color:#fff;padding:11px 18px;border-radius:8px;
  font-size:13px;opacity:0;transform:translateY(8px);
  transition:opacity .2s,transform .2s;pointer-events:none;max-width:300px;
}
.toast.show{opacity:1;transform:translateY(0);}
.toast.ok{border-left:3px solid var(--green);}
.toast.err{border-left:3px solid var(--red);}

.loading{text-align:center;padding:40px;color:var(--t3);font-size:13px;}

@media(max-width:800px){
  .side-panel{position:fixed;top:var(--hdr-h);right:0;bottom:0;z-index:150;box-shadow:-4px 0 20px rgba(0,0,0,.15);}
  .form-row-2{grid-template-columns:1fr;}
  .main-pad{padding:14px;}
}
</style>
</head>
<body>

<div class="topbar">
  <div>
    <div class="tb-logo">SMERP</div>
    <div class="tb-sub">COLLABORATION</div>
  </div>
  <div class="tb-title">개발요청 관리</div>
  <div class="tb-spacer"></div>
  <span class="tb-user" id="tbUser"></span>
  <a class="tb-back" href="index.html">← 메인으로</a>
</div>

<div class="tab-bar">
  <button class="tab-btn active" onclick="switchTab('list')" id="tab-list">📋 요청 목록</button>
  <button class="tab-btn" onclick="switchTab('register')" id="tab-register">✏️ 요청 등록</button>
</div>

<!-- ── 탭: 요청 목록 ── -->
<div class="tab-panel active" id="panel-list">
  <div class="list-layout">
    <div class="list-area">
      <div class="filter-bar">
        <select id="fStatus" onchange="loadList()">
          <option value="">전체 상태</option>
          <option value="접수">접수</option>
          <option value="검토중">검토중</option>
          <option value="개발중">개발중</option>
          <option value="완료">완료</option>
          <option value="보류">보류</option>
        </select>
        <select id="fType" onchange="loadList()">
          <option value="">전체 유형</option>
          <option value="기능추가">기능추가</option>
          <option value="버그수정">버그수정</option>
          <option value="UI개선">UI개선</option>
          <option value="기타">기타</option>
        </select>
        <select id="fPriority" onchange="loadList()">
          <option value="">전체 우선순위</option>
          <option value="높음">높음</option>
          <option value="보통">보통</option>
          <option value="낮음">낮음</option>
        </select>
        <input type="text" id="fSearch" placeholder="제목 검색..." style="width:180px;" oninput="renderList()">
        <button class="btn btn-outline" onclick="resetFilters()">초기화</button>
        <span class="cnt-badge" id="listCnt">0건</span>
      </div>
      <div class="tbl-wrap">
        <table id="listTable">
          <thead>
            <tr>
              <th style="width:44px;">No</th>
              <th style="width:130px;" class="sortable" onclick="sortBy('created_at')">요청일시<span class="sort-icon" id="sort-created_at">↓</span><div class="col-resizer"></div></th>
              <th style="width:72px;" class="sortable" onclick="sortBy('emp_name')">등록자<span class="sort-icon" id="sort-emp_name"></span><div class="col-resizer"></div></th>
              <th style="width:150px;">화면<div class="col-resizer"></div></th>
              <th style="width:80px;" class="sortable" onclick="sortBy('request_type')">요청유형<span class="sort-icon" id="sort-request_type"></span><div class="col-resizer"></div></th>
              <th style="width:72px;">우선순위<div class="col-resizer"></div></th>
              <th style="width:72px;" class="sortable" onclick="sortBy('status')">상태<span class="sort-icon" id="sort-status"></span><div class="col-resizer"></div></th>
              <th style="width:240px;">제목<div class="col-resizer"></div></th>
              <th style="width:90px;">적용일<div class="col-resizer"></div></th>
            </tr>
          </thead>
          <tbody id="listBody">
            <tr><td colspan="9" class="loading">로딩중...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- 사이드 패널 -->
    <div class="side-panel" id="sidePanel">
      <div class="sp-header">
        <h3 id="spTitle">상세 보기</h3>
        <button class="sp-close" onclick="closePanel()">✕</button>
      </div>
      <div class="sp-body" id="spBody">
        <div class="sp-empty">
          <div class="sp-empty-icon">👆</div>
          <div class="sp-empty-msg">목록에서 항목을 클릭하면<br>상세 내용이 표시됩니다</div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ── 탭: 요청 등록 ── -->
<div class="tab-panel" id="panel-register">
  <div class="main-pad">
    <div class="form-card">
      <div class="form-row-2">
        <div class="form-row">
          <label class="form-label">화면 (메뉴)<span>*</span></label>
          <input class="form-input" id="regScreen" list="screenList" placeholder="화면명 입력 또는 선택..." autocomplete="off">
          <datalist id="screenList"></datalist>
          <div class="form-hint">기존 등록된 화면명이 자동완성으로 표시됩니다</div>
        </div>
        <div class="form-row">
          <label class="form-label">요청 유형<span>*</span></label>
          <select class="form-select" id="regType">
            <option value="">선택하세요</option>
            <option value="기능추가">기능추가</option>
            <option value="버그수정">버그수정</option>
            <option value="UI개선">UI개선</option>
            <option value="기타">기타</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <label class="form-label">제목<span>*</span></label>
        <input class="form-input" id="regTitle" placeholder="요청 내용을 간략히 적어주세요" maxlength="100">
      </div>
      <div class="form-row">
        <label class="form-label">상세 내용<span>*</span></label>
        <textarea class="form-textarea" id="regContent" placeholder="어떤 문제가 있는지, 어떻게 개선됐으면 하는지 자세히 적어주세요" rows="6"></textarea>
      </div>
      <div class="form-footer">
        <button class="btn btn-primary" onclick="submitRequest()">등록하기</button>
        <button class="btn btn-outline" onclick="clearForm()">초기화</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SB_URL='https://muxuhrbsbrstmrrvlupw.supabase.co';
const SB_KEY='sb_publishable_RYvQTDoDvwTuVPezpIeotg_EDSd9Wbb';

const curUser = localStorage.getItem('sme_user') || '';
let curEmpId = 0;
let allList = [];
let sortKey = 'created_at', sortAsc = false;
let selectedId = null;

/* ── Supabase ── */
async function sbGet(table, params=''){
  const r = await fetch(`${SB_URL}/rest/v1/${table}?${params}`,{
    headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Accept':'application/json'}
  });
  if(!r.ok){ const e=await r.json(); throw new Error(e.message||r.status); }
  return r.json();
}
async function sbPost(table, body){
  const r = await fetch(`${SB_URL}/rest/v1/${table}`,{
    method:'POST',
    headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json','Prefer':'return=representation'},
    body:JSON.stringify(body)
  });
  if(!r.ok){ const e=await r.json(); throw new Error(e.message||r.status); }
  return r.json();
}
async function sbPatch(table, id, body){
  const r = await fetch(`${SB_URL}/rest/v1/${table}?id=eq.${id}`,{
    method:'PATCH',
    headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json','Prefer':'return=representation'},
    body:JSON.stringify(body)
  });
  if(!r.ok){ const e=await r.json(); throw new Error(e.message||r.status); }
  return r.json();
}

/* ── 초기화 ── */
async function init(){
  if(!curUser){
    alert('로그인이 필요합니다. 메인 화면에서 접근해주세요.');
    location.href='index.html'; return;
  }
  document.getElementById('tbUser').textContent = curUser + ' 님';
  try{
    const emps = await sbGet('employees','emp_name=eq.'+encodeURIComponent(curUser)+'&select=id');
    if(emps && emps.length>0) curEmpId = emps[0].id;
  }catch(e){}
  await loadScreenList();
  await loadList();
  initColResize();
}

/* ── 자동완성 ── */
async function loadScreenList(){
  try{
    const data = await sbGet('smerp_request','select=screen&order=screen.asc');
    const screens = [...new Set((data||[]).map(d=>d.screen).filter(Boolean))];
    document.getElementById('screenList').innerHTML = screens.map(s=>`<option value="${esc(s)}">`).join('');
  }catch(e){}
}

/* ── 탭 전환 ── */
function switchTab(tab){
  document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('panel-'+tab).classList.add('active');
  document.getElementById('tab-'+tab).classList.add('active');
  if(tab==='list') loadList();
}

/* ── 목록 로드 ── */
async function loadList(){
  document.getElementById('listBody').innerHTML='<tr><td colspan="9" class="loading">로딩중...</td></tr>';
  try{
    let params='select=*&order=created_at.desc';
    const st=document.getElementById('fStatus').value;
    const ty=document.getElementById('fType').value;
    const pr=document.getElementById('fPriority').value;
    if(st) params+='&status=eq.'+encodeURIComponent(st);
    if(ty) params+='&request_type=eq.'+encodeURIComponent(ty);
    if(pr) params+='&priority=eq.'+encodeURIComponent(pr);
    allList = await sbGet('smerp_request', params) || [];
  }catch(e){ allList=[]; }
  renderList();
}

/* ── 목록 렌더링 ── */
function renderList(){
  const kw = document.getElementById('fSearch').value.trim().toLowerCase();
  let data = kw ? allList.filter(r=>(r.title||'').toLowerCase().includes(kw)) : [...allList];

  data.sort((a,b)=>{
    let av=a[sortKey]||'', bv=b[sortKey]||'';
    if(av<bv) return sortAsc?-1:1;
    if(av>bv) return sortAsc?1:-1;
    return 0;
  });

  document.getElementById('listCnt').textContent = data.length+'건';
  const tbody = document.getElementById('listBody');
  if(!data.length){
    tbody.innerHTML='<tr><td colspan="9" class="empty" style="padding:40px;"><div class="empty-icon">📭</div><div class="empty-msg">요청 내역이 없습니다</div></td></tr>';
    return;
  }
  tbody.innerHTML = data.map((r,i)=>`
    <tr onclick="openPanel(${r.id})" class="${r.id===selectedId?'selected':''}">
      <td style="text-align:center;font-family:'Share Tech Mono',monospace;color:var(--t3);">${data.length-i}</td>
      <td style="font-family:'Share Tech Mono',monospace;font-size:11px;">${fmtDT(r.created_at)}</td>
      <td>${esc(r.emp_name||'')}</td>
      <td title="${esc(r.screen||'')}">${esc(r.screen||'')}</td>
      <td>${esc(r.request_type||'')}</td>
      <td>${r.priority?'<span class="badge badge-'+r.priority+'">'+r.priority+'</span>':'-'}</td>
      <td><span class="badge badge-${r.status||'접수'}">${r.status||'접수'}</span></td>
      <td title="${esc(r.title||'')}">${esc(r.title||'')}</td>
      <td>${r.applied_date||'-'}</td>
    </tr>
  `).join('');
}

/* ── 사이드 패널 열기 ── */
function openPanel(id){
  selectedId = id;
  const r = allList.find(x=>x.id===id);
  if(!r) return;
  renderList(); // 선택 행 하이라이트

  const isOwner = (r.emp_name === curUser);
  const isAdmin = (curEmpId === 2);
  // empId=2는 처리관리 전담 — 본인 건이라도 소유자 수정 폼 비활성
  const canEditOwner = isOwner && r.status === '접수' && !isAdmin;

  document.getElementById('spTitle').textContent = '요청 상세';
  document.getElementById('spBody').innerHTML = buildPanel(r, isAdmin, canEditOwner);
  document.getElementById('sidePanel').classList.add('open');
}

function closePanel(){
  selectedId = null;
  document.getElementById('sidePanel').classList.remove('open');
  renderList();
}

/* ── 패널 HTML 생성 ── */
function buildPanel(r, isAdmin, canEditOwner){
  const ro = v => `<div class="sp-value">${esc(v||'-')}</div>`;
  const inp = (id,val,ph) => `<input class="sp-input" id="${id}" value="${esc(val||'')}" placeholder="${ph||''}">`;
  const sel = (id,val,opts) => `<select class="sp-select" id="${id}">${opts.map(o=>`<option${o===val?' selected':''}>${o}</option>`).join('')}</select>`;
  const ta  = (id,val,ph,h) => `<textarea class="sp-textarea" id="${id}" style="min-height:${h||80}px" placeholder="${ph||''}">${esc(val||'')}</textarea>`;

  let html = `
    <div class="sp-row">
      <div class="sp-label">등록자 · 요청일시</div>
      <div class="sp-value">${esc(r.emp_name||'')} · ${fmtDT(r.created_at)}</div>
    </div>`;

  // 화면 · 유형
  if(canEditOwner){
    html += `
    <div class="sp-row">
      <div class="sp-label">화면 (메뉴)</div>
      <input class="sp-input" id="spScreen" list="screenList" value="${esc(r.screen||'')}" autocomplete="off">
    </div>
    <div class="sp-row">
      <div class="sp-label">요청 유형</div>
      ${sel('spType', r.request_type||'', ['기능추가','버그수정','UI개선','기타'])}
    </div>`;
  } else {
    html += `
    <div class="sp-row">
      <div class="sp-label">화면 · 유형</div>
      ${ro((r.screen||'') + ' · ' + (r.request_type||''))}
    </div>`;
  }

  // 제목
  if(canEditOwner){
    html += `<div class="sp-row"><div class="sp-label">제목</div>${inp('spTitle2', r.title, '제목')}</div>`;
  } else {
    html += `<div class="sp-row"><div class="sp-label">제목</div><div class="sp-value" style="font-weight:500;">${esc(r.title||'')}</div></div>`;
  }

  // 내용
  if(canEditOwner){
    html += `<div class="sp-row"><div class="sp-label">요청 내용</div>${ta('spContent', r.content, '상세 내용', 100)}</div>`;
  } else {
    html += `<div class="sp-row"><div class="sp-label">요청 내용</div><div class="sp-content">${esc(r.content||'')}</div></div>`;
  }

  // 본인 수정 저장 버튼
  if(canEditOwner){
    html += `<button class="btn btn-outline" style="width:100%;margin-bottom:14px;" onclick="saveOwnerEdit(${r.id})">내용 저장</button>`;
  }

  // ── 관리자(empId=2) 처리 영역 ──
  if(isAdmin){
    html += `<hr class="sp-sep"><div class="sp-section-title">처리 관리</div>`;
    html += `
    <div class="sp-row">
      <div class="sp-label">우선순위</div>
      ${sel('spPriority', r.priority||'보통', ['높음','보통','낮음'])}
    </div>
    <div class="sp-row">
      <div class="sp-label">상태 변경</div>
      ${sel('spStatus', r.status||'접수', ['접수','검토중','개발중','완료','보류'])}
    </div>
    <div class="sp-row">
      <div class="sp-label">처리 결과 / 의견</div>
      ${ta('spResult', r.result, '처리 내용 또는 의견을 입력하세요', 90)}
    </div>
    <div class="sp-row">
      <div class="sp-label">적용일</div>
      <input type="date" class="sp-input" id="spApplied" value="${r.applied_date||''}">
    </div>
    <button class="btn btn-primary" style="width:100%;" onclick="saveAdmin(${r.id})">처리 내용 저장</button>`;
  } else if(r.result){
    // 관리자가 아니어도 처리결과는 읽기로 표시
    html += `<hr class="sp-sep">
    <div class="sp-row">
      <div class="sp-label">처리 결과 / 의견</div>
      <div class="sp-content">${esc(r.result)}</div>
    </div>`;
    if(r.applied_date){
      html += `<div class="sp-row"><div class="sp-label">적용일</div>${ro(r.applied_date)}</div>`;
    }
  }

  return html;
}

/* ── 본인 수정 저장 ── */
async function saveOwnerEdit(id){
  const screen  = document.getElementById('spScreen').value.trim();
  const type    = document.getElementById('spType').value;
  const title   = document.getElementById('spTitle2').value.trim();
  const content = document.getElementById('spContent').value.trim();
  if(!screen||!title||!content){ showToast('필수 항목을 입력해주세요','err'); return; }
  try{
    await sbPatch('smerp_request', id, {screen, request_type:type, title, content});
    const idx = allList.findIndex(x=>x.id===id);
    if(idx>=0) Object.assign(allList[idx],{screen, request_type:type, title, content});
    renderList();
    showToast('수정되었습니다','ok');
    // 패널 갱신
    const r = allList.find(x=>x.id===id);
    document.getElementById('spBody').innerHTML = buildPanel(r, curEmpId===2, r.emp_name===curUser && r.status==='접수');
  }catch(e){ showToast('오류: '+e.message,'err'); }
}

/* ── 관리자 처리 저장 ── */
async function saveAdmin(id){
  const priority = document.getElementById('spPriority').value;
  const status   = document.getElementById('spStatus').value;
  const result   = document.getElementById('spResult').value.trim();
  const applied  = document.getElementById('spApplied').value;
  try{
    await sbPatch('smerp_request', id, {
      priority, status,
      result: result||null,
      applied_date: applied||null
    });
    const idx = allList.findIndex(x=>x.id===id);
    if(idx>=0) Object.assign(allList[idx],{priority, status, result, applied_date:applied||null});
    renderList();
    showToast('저장되었습니다','ok');
    // 패널 갱신
    const r = allList.find(x=>x.id===id);
    document.getElementById('spBody').innerHTML = buildPanel(r, true, r.emp_name===curUser && r.status==='접수');
  }catch(e){ showToast('오류: '+e.message,'err'); }
}

/* ── 정렬 ── */
function sortBy(key){
  if(sortKey===key) sortAsc=!sortAsc;
  else { sortKey=key; sortAsc=true; }
  ['created_at','emp_name','request_type','status'].forEach(k=>{
    const el=document.getElementById('sort-'+k);
    if(el) el.textContent = k===sortKey?(sortAsc?'↑':'↓'):'';
  });
  renderList();
}

/* ── 필터 초기화 ── */
function resetFilters(){
  ['fStatus','fType','fPriority'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('fSearch').value='';
  loadList();
}

/* ── 요청 등록 ── */
async function submitRequest(){
  const screen  = document.getElementById('regScreen').value.trim();
  const type    = document.getElementById('regType').value;
  const title   = document.getElementById('regTitle').value.trim();
  const content = document.getElementById('regContent').value.trim();
  if(!screen)  { showToast('화면명을 입력해주세요','err'); return; }
  if(!type)    { showToast('요청 유형을 선택해주세요','err'); return; }
  if(!title)   { showToast('제목을 입력해주세요','err'); return; }
  if(!content) { showToast('상세 내용을 입력해주세요','err'); return; }
  try{
    await sbPost('smerp_request',{
      emp_name: curUser,
      screen, request_type: type, title, content,
      status:'접수', priority:'보통'
    });
    showToast('요청이 등록되었습니다','ok');
    clearForm();
    await loadScreenList();
    switchTab('list');
    await loadList();
  }catch(e){ showToast('오류: '+e.message,'err'); }
}

function clearForm(){
  ['regScreen','regTitle','regContent'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('regType').value='';
}

/* ── 컬럼 리사이즈 ── */
function initColResize(){
  const KEY='collab_col_v2';
  const table=document.getElementById('listTable');
  const ths=[...table.querySelectorAll('thead th')];
  const saved=JSON.parse(localStorage.getItem(KEY)||'null');
  const def=[44,130,72,150,80,72,72,240,90];
  ths.forEach((th,i)=>{ th.style.width=(saved?saved[i]:def[i])+'px'; });
  table.style.tableLayout='fixed';
  table.style.width=ths.reduce((s,th)=>s+parseInt(th.style.width),0)+'px';
  ths.forEach((th)=>{
    const rz=th.querySelector('.col-resizer');
    if(!rz) return;
    let sx,sw;
    rz.addEventListener('mousedown',e=>{
      e.preventDefault(); sx=e.clientX; sw=parseInt(th.style.width);
      rz.classList.add('dragging');
      const mm=e2=>{ th.style.width=Math.max(40,sw+(e2.clientX-sx))+'px'; table.style.width=ths.reduce((s,t)=>s+parseInt(t.style.width),0)+'px'; };
      const mu=()=>{ rz.classList.remove('dragging'); document.removeEventListener('mousemove',mm); document.removeEventListener('mouseup',mu); localStorage.setItem(KEY,JSON.stringify(ths.map(t=>parseInt(t.style.width)))); };
      document.addEventListener('mousemove',mm);
      document.addEventListener('mouseup',mu);
    });
  });
}

/* ── 유틸 ── */
function fmtDT(ts){
  if(!ts) return '-';
  const d=new Date(ts);
  return `${d.getFullYear()}.${p2(d.getMonth()+1)}.${p2(d.getDate())} ${p2(d.getHours())}:${p2(d.getMinutes())}`;
}
function p2(n){return String(n).padStart(2,'0');}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

let toastTimer;
function showToast(msg,type='ok'){
  const t=document.getElementById('toast');
  t.textContent=msg; t.className='toast show '+(type==='ok'?'ok':'err');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),2800);
}

init();
</script>
